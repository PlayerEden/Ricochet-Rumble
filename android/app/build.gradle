plugins { id 'com.android.application' }
android {
    namespace 'com.playereden.ricochetrumble'
    compileSdk 36
    defaultConfig {
        applicationId 'com.playereden.ricochetrumble'
        minSdk 26
        targetSdk 36
        versionCode 36
        versionName '0.9.19-pilot-visual-prototype'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}