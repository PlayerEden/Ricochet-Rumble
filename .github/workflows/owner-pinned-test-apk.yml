name: Sector Rebound - OWNER-KEYED stable test APK build (manual only)
on:
  workflow_dispatch:
    inputs:
      evidence_note:
        description: 'Owner-authorized test release verification note'
        required: false
        type: string
permissions:
  contents: read
jobs:
  owner-signed-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_TEST_CERT: ${{ vars.SR_TEST_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reject missing private test signer or public digest (NEVER auto-fallback)
        env:
          SR_TEST_STORE_FILE: ${{ runner.temp }}/sr-test-credentials/test-only-keystore.jks
          SR_TEST_STORE_PASSWORD: ${{ secrets.SR_TEST_STORE_PASSWORD }}
          SR_TEST_KEY_ALIAS: ${{ secrets.SR_TEST_KEY_ALIAS }}
          SR_TEST_KEY_PASSWORD: ${{ secrets.SR_TEST_KEY_PASSWORD }}
          SR_TEST_KEYSTORE_B64: ${{ secrets.SR_TEST_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          for key in SR_TEST_STORE_PASSWORD SR_TEST_KEY_ALIAS SR_TEST_KEY_PASSWORD SR_TEST_KEYSTORE_B64; do
            test -n "${!key}" || { echo "Missing private test signer configuration: $key" >&2; exit 1; }
          done
          [[ "$EXPECTED_TEST_CERT" =~ ^[a-fA-F0-9]{64}$ ]] || { echo 'Pin expected public certificate digest as SR_TEST_CERT_SHA256 variable' >&2; exit 1; }
          mkdir -p "$(dirname "$SR_TEST_STORE_FILE")"
          printf '%s' "$SR_TEST_KEYSTORE_B64" | base64 --decode > "$SR_TEST_STORE_FILE"
          chmod 600 "$SR_TEST_STORE_FILE"
          test -s "$SR_TEST_STORE_FILE"
      - name: Install official Android package/signing verification tools
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Verify app/game/test source before owner's signed preview
        run: |
          set -euo pipefail
          node tests/smoke.mjs
          node tests/dossier.mjs
          node tests/save-backup.mjs
          node tests/android-upgrade-readiness.mjs
          cmp web/game.js android/app/src/main/assets/game.js
          cmp web/dossier.js android/app/src/main/assets/dossier.js
          cmp web/save-backup.js android/app/src/main/assets/save-backup.js
      - name: Build APK with ONLY the PRIVATE pinned TEST key
        working-directory: android
        env:
          SR_TEST_STORE_FILE: ${{ runner.temp }}/sr-test-credentials/test-only-keystore.jks
          SR_TEST_STORE_PASSWORD: ${{ secrets.SR_TEST_STORE_PASSWORD }}
          SR_TEST_KEY_ALIAS: ${{ secrets.SR_TEST_KEY_ALIAS }}
          SR_TEST_KEY_PASSWORD: ${{ secrets.SR_TEST_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify exact installed APK signing certificate BEFORE sharing
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SIGNER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner"
          AAPT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0/aapt"
          "$SIGNER" verify --min-sdk-version 26 --verbose --print-certs "$APK" > "$RUNNER_TEMP/signer-public.txt"
          actual="$(sed -nE 's/^[[:space:]]*Signer #1 certificate SHA-256 digest: ([a-fA-F0-9:]+).*$/\1/p' "$RUNNER_TEMP/signer-public.txt" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          pin="$(printf '%s' "$EXPECTED_TEST_CERT" | tr '[:upper:]' '[:lower:]')"
          test -n "$actual" && test "$actual" = "$pin" || { echo "CERTIFICATE MISMATCH: refusing to distribute test APK" >&2; exit 1; }
          metadata="$("$AAPT" dump badging "$APK" | head -n 1)"
          [[ "$metadata" == *"name='com.playereden.ricochetrumble'"* ]] || exit 1
          [[ "$metadata" == *"versionCode='50'"* ]] || exit 1
          mkdir -p qa-results
          {
            echo "Sha256 of public TEST signer certificate: $actual"
            echo "Package metadata: $metadata"
            echo "APK source SHA: $GITHUB_SHA"
            echo "APK sha256: $(sha256sum "$APK" | awk '{print $1}')"
            echo "This proves the certificate of THIS APK only, not compatibility with any older, differently signed archived APK."
          } > qa-results/pinned-test-apk-verification.txt
      - name: Upload verified owner-keyed APK; no auto release or Play distribution
        uses: actions/upload-artifact@v4
        with:
          name: owner-test-apk-pinned-certificate-${{ github.run_id }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            qa-results/pinned-test-apk-verification.txt
          if-no-files-found: error
          retention-days: 14
      - name: Erase temporary keystore from CI runner
        if: always()
        env:
          SR_TEST_STORE_FILE: ${{ runner.temp }}/sr-test-credentials/test-only-keystore.jks
        run: rm -rf "$(dirname "$SR_TEST_STORE_FILE")"
