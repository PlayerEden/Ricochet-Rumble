name: Sector Rebound - archive exact v0.9.36 local presets Android test once
on:
  push:
    branches:
      - feature/custom-presets-v0936
    paths:
      - .github/workflows/publish-v0936-exact-qa-once.yml
permissions:
  contents: write
  actions: read
jobs:
  archive-original-passing-artifact:
    if: github.repository == 'PlayerEden/Ricochet-Rumble'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      QA_RUN: '40832553495'
      SOURCE_SHA: '03064a905d77c0cf4b2c33a306b29ef0cfe5b04e'
      TAG: 'v0.9.36-custom-presets-test'
      APK: 'sector-rebound-v0.9.36-custom-presets-debug.apk'
    steps:
      - name: Require successful exact full QA and absent tag
        run: |
          set -euo pipefail
          details="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA_RUN")"
          test "$(jq -r '.status' <<< "$details")" = "completed"
          test "$(jq -r '.conclusion' <<< "$details")" = "success"
          test "$(jq -r '.head_sha' <<< "$details")" = "$SOURCE_SHA"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Release tag already exists. Refusing overwrite" >&2
            exit 1
          fi
      - name: Recover original APK and real QA evidence without rebuilding
        run: |
          set -euo pipefail
          mkdir -p original qa
          gh run download "$QA_RUN" --repo "$GITHUB_REPOSITORY" --name "debug-apk-$QA_RUN" --dir original
          gh run download "$QA_RUN" --repo "$GITHUB_REPOSITORY" --name "sector-rebound-qa-$QA_RUN-1" --dir qa
          test -s original/app-debug.apk
          mv original/app-debug.apk "$APK"
          zip -qr sector-rebound-v0.9.36-custom-presets-qa.zip qa
          sha256sum "$APK" sector-rebound-v0.9.36-custom-presets-qa.zip > v0.9.36-sha256.txt
      - name: Publish original tested bytes as immutable Android prerelease
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Preexisting tag; refusing overwrite" >&2
            exit 1
          fi
          {
            echo '# Sector Rebound v0.9.36 — Named Local Custom Presets Test'
            echo
            echo '**Experimental Android debug APK. Full automated QA passed; owner physical phone approval PENDING. NOT Google Play signed.**'
            echo
            echo '- Custom Match has optional collapsed LOCAL PRESETS section: save up to 5 named setups, explicit Load, two-tap Delete, Reset to Default without deleting saved presets.'
            echo '- Versioned on-device storage validates rules and names, avoids duplicate overwrites and safely handles malformed/older data.'
            echo '- Current Custom draft and Quick Play settings remain separate. No online preset sync or scored-balance changes.'
            echo '- Full Chromium-tested real Save -> Reset -> reload -> Load -> Delete, Custom Survival/TDM match flows and phone-landscape geometry.'
            echo '- Original debug APK copied byte-identically from the successful workflow; no recompilation or resigning.'
            echo "- Exact gameplay/test source SHA: $SOURCE_SHA"
            echo "- Fast CI PASS: https://github.com/$GITHUB_REPOSITORY/actions/runs/40832553494"
            echo "- Full Chromium/Android QA PASS: https://github.com/$GITHUB_REPOSITORY/actions/runs/$QA_RUN"
            echo "- Draft PR #55: https://github.com/$GITHUB_REPOSITORY/pull/55"
            echo "- APK SHA-256: $(sha256sum "$APK" | awk '{print $1}')"
            echo
            echo 'PENDING: owner handset comfort, local storage persistence across app upgrade/uninstall, 50+ natural bot rounds, two-phone LAN and Google Play production signing.'
            echo 'An Android debug signature mismatch can block an in-place update. Uninstalling may erase local preferences.'
          } > release-notes.md
          gh release create "$TAG" "$APK" sector-rebound-v0.9.36-custom-presets-qa.zip v0.9.36-sha256.txt --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --prerelease --title "Sector Rebound v0.9.36 — Named Local Presets Android Test" --notes-file release-notes.md
