name: Sector Rebound - v0.9.72 D3-A1 host-only LAN bot owner preview APK
on:
  push:
    branches: [experiment/lan-host-bots-d3-a1]
    paths:
      - '.github/workflows/lan-host-bots-owner-apk.yml'
      # No unattended rebuild on later gameplay edits; require a deliberate new release gate.

permissions:
  contents: read

concurrency:
  group: sr-d3-a1-host-bots-owner-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lan-host-bots-owner-preview-apk:
    if: github.ref == 'refs/heads/experiment/lan-host-bots-d3-a1'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install required Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Check game and source parity
        run: |
          set -euo pipefail
          node tests/lan-room-state-d3-a0.mjs
          node tests/lan-series-kernel.mjs
          node tests/smoke.mjs
          node tests/dossier.mjs
          node tests/save-backup.mjs
          node tests/android-upgrade-readiness.mjs
          node tests/ballistic-trace-a2.mjs
          # A1-C1 and D1-D2 behavior remains protected; D3-A1 host-only bot gameplay checked below.
          # Verify A1-A3 shot behavior, B1 FF, B2 aim and C1 per-match teams/colors with source parity.
          node --check web/game.js
          node --check web/lan-room.js
          node --check tests/lan-host-bots-d3-a1.mjs
          node tests/test-signer-contract.mjs
          node tests/ctf-rules.mjs
          node tests/ctf-objective-ai.mjs
          node --check tests/pilot-combat-fairness-qa.mjs
          node --check tests/pilot-release-aim-qa.mjs
          node --check tests/bot-shot-parity-qa.mjs
          node --check tests/bot-combat-cues-qa.mjs
          node --check tests/combat-hud-truth-qa.mjs
          node --check tests/combat-feedback-parity-qa.mjs
          node --check tests/solo-bot-last-seen-qa.mjs
          node --check tests/landscape-hud-safe-zones-qa.mjs
          node --check tests/match-flow-truth-qa.mjs
          node --check tests/first-match-entry-browser-qa.mjs
          for asset in game.js index.html style.css scored-match.js dossier.js save-backup.js ctf-rules.js ctf-ai.js forward-bays.js lan-series.js lan-room.js; do
            cmp "web/$asset" "android/app/src/main/assets/$asset"
          done
      - name: Validate pilot combat viewport, assist and options in Chromium
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          npm install --no-save --ignore-scripts playwright-core@1.56.1
          node tests/pilot-combat-fairness-qa.mjs
          node tests/pilot-release-aim-qa.mjs
          node tests/bot-shot-parity-qa.mjs
          node tests/bot-combat-cues-qa.mjs
          node tests/allied-aim-visual-qa.mjs
          node tests/quick-play-live-flow-qa.mjs
          node tests/lan-host-bots-d3-a1.mjs
          node tests/lan-lobby-flow-qa.mjs
          node tests/combat-hud-truth-qa.mjs
          node tests/combat-feedback-parity-qa.mjs
          node tests/solo-bot-last-seen-qa.mjs
          node tests/landscape-hud-safe-zones-qa.mjs
          node tests/match-flow-truth-qa.mjs
          node tests/ctf-contested-human-attack.mjs
          node tests/first-match-entry-browser-qa.mjs
          VEHICLE_BALANCE_ENFORCE=1 node tests/team-vehicle-route-qa.mjs
      - name: Recover immutable public AOSP development key (never production)
        env:
          SR_TEST_STORE_FILE: ${{ runner.temp }}/sr-aosp-preview/public-testkey.p12
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SR_TEST_STORE_FILE")"
          base="https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security"
          for name in testkey.pk8 testkey.x509.pem; do
            curl --fail --show-error --silent --location --retry 3 "$base/$name?format=TEXT" | base64 --decode > "$RUNNER_TEMP/$name"
            test -s "$RUNNER_TEMP/$name"
          done
          [[ "$(git hash-object "$RUNNER_TEMP/testkey.pk8")" == '586c1bd5cf96f9358f36b37ea98fef93f4d0a8e3' ]] || exit 1
          [[ "$(git hash-object "$RUNNER_TEMP/testkey.x509.pem")" == 'e242d83e2bf72169ab0abd5280d4d455caef71eb' ]] || exit 1
          openssl pkcs8 -inform DER -nocrypt -in "$RUNNER_TEMP/testkey.pk8" -out "$RUNNER_TEMP/testkey.key.pem"
          openssl pkcs12 -export -inkey "$RUNNER_TEMP/testkey.key.pem" -in "$RUNNER_TEMP/testkey.x509.pem" -out "$SR_TEST_STORE_FILE" -name aosp-public-testkey -passout pass:disposable-preview-only
          test -s "$SR_TEST_STORE_FILE"
      - name: Build signed Android preview with automatically increasing version code
        working-directory: android
        env:
          SR_TEST_STORE_FILE: ${{ runner.temp }}/sr-aosp-preview/public-testkey.p12
          SR_TEST_STORE_PASSWORD: disposable-preview-only
          SR_TEST_KEY_ALIAS: aosp-public-testkey
          SR_TEST_KEY_PASSWORD: disposable-preview-only
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == '1' ]] || { echo 'Start a new workflow run for a newer preview'; exit 1; }
          [[ "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          code=$((340000 + GITHUB_RUN_NUMBER))
          (( code > 100000 && code <= 2100000000 )) || exit 1
          gradle --no-daemon :app:assembleDebug -PsrPreviewPackage=true "-PsrPreviewVersionCode=$code" "-PsrPreviewVersionName=0.9.72-hostbots.$GITHUB_RUN_NUMBER"
      - name: Verify real APK signer, application ID, version and embedded game assets
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          signer="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner"
          aapt="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0/aapt"
          "$signer" verify --min-sdk-version 26 --print-certs "$apk" > "$RUNNER_TEMP/apk-cert.txt"
          actual="$(sed -nE 's/.*Signer #1 certificate SHA-256 digest: ([a-fA-F0-9:]+).*$/\1/p' "$RUNNER_TEMP/apk-cert.txt" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          expected="$(openssl x509 -in "$RUNNER_TEMP/testkey.x509.pem" -outform DER | sha256sum | awk '{print $1}')"
          [[ "$actual" =~ ^[0-9a-f]{64}$ && "$actual" == "$expected" ]] || { echo 'Unexpected preview signer; reject APK'; exit 1; }
          # Previous verified v0.9.71 D2 owner preview has versionCode 330001.
          # The PUBLIC AOSP development signer (not the owner's private key) is the actual
          # existing upgrade identity; never silently switch to another signer.
          installed_preview_cert="a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc"
          [[ "$actual" == "$installed_preview_cert" ]] || { echo 'INCOMPATIBLE SIGNATURE: would force uninstall of verified v0.9.71'; exit 1; }
          metadata="$("$aapt" dump badging "$apk" | head -n 1)"
          code=$((340000 + GITHUB_RUN_NUMBER))
          (( code > 330001 && code <= 2100000000 )) || { echo 'VERSION DOWNGRADE: must exceed v0.9.71 code 330001'; exit 1; }
          [[ "$metadata" == *"name='com.playereden.ricochetrumble.preview'"* ]] || exit 1
          [[ "$metadata" == *"versionCode='$code'"* ]] || exit 1
          [[ "$metadata" == *"versionName='0.9.72-hostbots.$GITHUB_RUN_NUMBER'"* ]] || exit 1
          for asset in game.js index.html style.css scored-match.js dossier.js save-backup.js ctf-rules.js ctf-ai.js forward-bays.js lan-series.js lan-room.js; do
            cmp "web/$asset" <(unzip -p "$apk" "assets/$asset") || exit 1
          done
          mkdir -p dist
          cp "$apk" "dist/sector-rebound-host-bots-$code.apk"
          {
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "APP_ID=com.playereden.ricochetrumble.preview"
            echo "VERSION_CODE=$code"
            echo "PUBLIC_TEST_SIGNER_SHA256=$actual"
            echo "APK_SHA256=$(sha256sum "dist/sector-rebound-host-bots-$code.apk" | awk '{print $1}')"
            echo "D3_A1_HOST_BOTS_EXPERIMENTAL_NOT_RELEASED; DISPOSABLE_AOSP_TEST_KEY_NOT_FOR_PLAY"
          } > dist/verification.txt
          echo "VERIFIED_PREVIEW_APK code=$code cert=$actual; no local PC configuration"
      - name: Upload installable preview APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: sector-rebound-host-bots-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Clean test signing files from runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/sr-aosp-preview" "$RUNNER_TEMP/testkey.pk8" "$RUNNER_TEMP/testkey.x509.pem" "$RUNNER_TEMP/testkey.key.pem"
