name: Publish v0.9.22-dev4 vehicle camera QA APK and images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0922-dev4-camera.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-v0922-dev4-camera-test
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download exact successful full-QA Android APK and screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run view 40599822784 --repo "$REPO" --json conclusion,headSha --jq '"QA: " + .conclusion + " " + .headSha' | tee qa-provenance.txt
          grep -Fxq 'QA: success 1e2eee64f8b6c89d4545f1c1517fe08dac92f117' qa-provenance.txt
          gh run download 40599822784 --repo "$REPO" --name debug-apk-40599822784 --dir apk-source
          gh run download 40599822784 --repo "$REPO" --name sector-rebound-qa-40599822784-1 --dir qa-source
          APK="$(find apk-source -type f -name 'app-debug.apk' | head -n 1)"
          test -n "$APK" && test -s "$APK"
          test "$(find qa-source -type f -name '*.png' | wc -l)" -ge 6
          cp "$APK" sector-rebound-v0.9.22-dev4-vehicle-camera-debug.apk
          (cd qa-source && zip -q -r ../sector-rebound-v0.9.22-dev4-visual-qa.zip .)
          sha256sum sector-rebound-v0.9.22-dev4-vehicle-camera-debug.apk sector-rebound-v0.9.22-dev4-visual-qa.zip > v0922-dev4-sha256.txt
      - name: Create immutable distinct dev4 test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=v0.9.22-dev4-vehicle-camera-test
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Refusing to overwrite already published test release."
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          ## Sector Rebound v0.9.22-dev4 -- vehicle-only camera phone test

          **Exact debug APK and screenshots from successful full Android/Chromium QA run [40599822784](https://github.com/PlayerEden/Ricochet-Rumble/actions/runs/40599822784), NOT rebuilt or resigned here.**
          Source commit: 1e2eee64f8b6c89d4545f1c1517fe08dac92f117, draft PR [#24](https://github.com/PlayerEden/Ricochet-Rumble/pull/24). Automated gameplay, viewport/camera assertions, screenshots, APK build, unsigned AAB build, and web/Android source parity passed.

          ### Vehicle-only visual change vs dev3
          - Pilot/on-foot camera **unchanged** at 1.07, retaining close-perspective planning for future pilot-only Close Quarters.
          - Tank camera pulls back from 0.98 to **0.87**. Mech camera pulls back from 0.94 to **0.82**.
          - Exterior field rendering apron grows from 260 to 380 world units so wide mobile displays can reach intended vehicle targets even in small mazes.
          - **No changes** to pilot art, combat/scoring, collision, game modes, HUD/touch targets, audio, or LAN.
          - Previous [dev3 camera APK](https://github.com/PlayerEden/Ricochet-Rumble/releases/tag/v0.9.22-dev3-camera-test) and [dev2 gameplay APK](https://github.com/PlayerEden/Ricochet-Rumble/releases/tag/v0.9.22-dev2-test) remain preserved.

          ### Owner acceptance
          Use [dev4 camera phone checklist](https://github.com/PlayerEden/Ricochet-Rumble/blob/main/docs/PLAYTEST_v0922_DEV4_VEHICLE_CAMERA.md). Test tank/mech field visibility and aim, verify pilot camera is unchanged, inspect all arena edges/corners, touch targets, performance, camera transitions and 3+ procedural sectors. Physical phone confirmation still pending. Close Quarters is a design plan, NOT a playable mode in this build.

          ### APK warnings
          Debug APK, not Google Play signed. Android internal versionName still 0.9.21-game-feel and versionCode 38 despite dev4 source. GitHub Actions runners may use different debug signing keys; Android may refuse an in-place update. **Uninstalling wipes local app data/settings**, so back up before choosing to replace a prior install. Don't try to install the unsigned AAB. Included ZIP contains the actual Chromium QA images and simulation outputs plus a separate SHA-256 manifest.
          EOF
          gh release create "$TAG" sector-rebound-v0.9.22-dev4-vehicle-camera-debug.apk sector-rebound-v0.9.22-dev4-visual-qa.zip v0922-dev4-sha256.txt --repo "$REPO" --target 1e2eee64f8b6c89d4545f1c1517fe08dac92f117 --title 'Sector Rebound v0.9.22-dev4 - vehicle-wide camera Android playtest' --notes-file release-notes.md --prerelease
