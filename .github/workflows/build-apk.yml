name: Android Test APK # Sector Rebound v0.9.18 Play API 36 and bundle readiness QA
on:
  workflow_dispatch:
  push:
    branches: [dev/sector-rebound-play-foundation-v0918]
    paths:
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run gameplay smoke tests
        run: node tests/smoke.mjs
      - name: Upload combat simulation and spawn fairness report
        uses: actions/upload-artifact@v4
        with:
          name: sector-rebound-v0.9.18-pacing-qa
          path: qa-results/combat-simulation.json
          if-no-files-found: error
          retention-days: 14
      - name: Checkout v0.9.17 visual baseline
        uses: actions/checkout@v4
        with:
          ref: dev/sector-rebound-match-flow-v0917
          path: visual-baseline
      - name: Capture visual before/after QA
        run: |
          set -e
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          export CHROME_BIN
          if [ -z "$CHROME_BIN" ]; then echo "Chrome is required for visual QA" >&2; exit 1; fi
          npm install --no-save --ignore-scripts playwright-core@1.56.1
          node tests/visual-qa.mjs
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sector-rebound-v0.9.18-visual-before-after
          path: qa-screens/
          if-no-files-found: error
          retention-days: 14
      - name: Build debug APK (no secrets required)
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Generate unsigned release Android App Bundle (Play readiness artifact)
        working-directory: android
        run: gradle --no-daemon :app:bundleRelease
      - name: Upload unsigned release AAB for validation only
        uses: actions/upload-artifact@v4
        with:
          name: sector-rebound-v0.9.18-unsigned-aab-NOT-FOR-PLAY
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: sector-rebound-v0.9.18-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14