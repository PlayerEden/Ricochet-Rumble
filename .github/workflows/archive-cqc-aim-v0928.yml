name: Archive exact QA-tested Sector Rebound CQC Aim Feel APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-cqc-aim-v0928.yml']
permissions:
  actions: read
  contents: write
concurrency:
  group: archive-sector-cqc-aim-v0928
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Recover original successful Android preview without compiling again
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PROOF="$(gh run view 40636487887 --repo "$REPO" --json conclusion,headSha --jq '.conclusion + " " + .headSha')"
          test "$PROOF" = "success d98f1f88f773b2cd53535f81a94290721adb0dac"
          gh run download 40636487887 --repo "$REPO" --name debug-apk-40636487887 --dir tested-apk
          gh run download 40636487887 --repo "$REPO" --name sector-rebound-qa-40636487887-1 --dir qa
          FILE="$(find tested-apk -type f -name 'app-debug.apk' -print -quit)"
          test -s "$FILE"
          cp "$FILE" sector-rebound-v0.9.28-cqc-aim-debug.apk
          (cd qa && zip -q -r ../sector-rebound-v0.9.28-aim-qa-evidence.zip .)
          sha256sum sector-rebound-v0.9.28-cqc-aim-debug.apk sector-rebound-v0.9.28-aim-qa-evidence.zip > aim-sha256.txt
      - name: Publish immutable experimental APK
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=v0.9.28-cqc-aim-feel-test
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite"
            exit 1
          fi
          cat > notes.md <<'EOF'
          # Sector Rebound v0.9.28 — Close Quarters Aim Feel Test

          **Experimental Android debug APK, NOT Google Play signed or merged into stable main.** Based on the owner-positive v0.9.27 pilot-only Close Quarters build.

          ## Aim changes (CQC ONLY)
          - **Slower deliberate pilot turning** 6.5 rad/sec versus previous movement-facing 12 rad/sec (~372°/s vs ~688°/s). Other survival pilot movement, tanks, mechs and bot turning remain unchanged.
          - **Dual thumb controls:** left joystick still moves. Hold FIRE with your right thumb and **drag your finger 14+ pixels toward the desired aim direction**; the pistol faces there independently of movement. Quick taps/holds without dragging still shoot facing the movement direction. Releasing/pause/cancel resets independent aim. No aim lock, homing or unfair human-only assist.
          - **More forgiving sidearm hit tolerance in CQC:** pilot center radius 14 -> 17.5 world units, same for human and AI. Walls, shielding, scoring, vehicles and Survival mode unchanged.
          - CQC FIRE caption says **HOLD · DRAG TO AIM**, and game manual explains independent right-thumb aiming.

          ## Validation
          - [Fast regression: 300 seeded mazes, CQC scoring, original Survival, turn tests, thumb state, projectile fairness: PASS](https://github.com/PlayerEden/Ricochet-Rumble/actions/runs/40636487876)
          - [Real Chromium (actual FIRE pointer-drag, CQC match flow, three mobile landscape viewports) + Android debug APK and unsigned AAB: PASS](https://github.com/PlayerEden/Ricochet-Rumble/actions/runs/40636487887)
          - **Exact tested source:** `d98f1f88f773b2cd53535f81a94290721adb0dac`. This APK is copied BYTE FOR BYTE from that full QA job: **no rebuilding/resigning**.
          - [DRAFT Aim Polish PR #45](https://github.com/PlayerEden/Ricochet-Rumble/pull/45). Keeps stable main gameplay untouched.
          - QA screenshot ZIP + SHA-256 checksums are included in this release.

          ## What to compare on your phone
          1. CQC: move left-thumb and drag your right thumb across FIRE to change gun direction. See whether turning feels controlled rather than twitchy.
          2. Hold FIRE without dragging: movement-based aiming should still behave normally.
          3. See whether small aim errors are less punishing while maintaining challenge. Test a complete CQC match and then original Survival/Team Survival.
          4. If the right-thumb gesture isn't intuitive, report that — we can consider a true independent second stick rather than forcing this variant.

          **Known caveats:** Physical Android feel acceptance is still pending; no new modes, online PvP or Play production signing. Debug APK still uses older internal Android version metadata; installing over another debug build may fail if signer differs. Uninstall may erase local settings. Previous [v0.9.27 first scored test remains rollback](https://github.com/PlayerEden/Ricochet-Rumble/releases/tag/v0.9.27-cqc-scored-test).
          EOF
          gh release create "$TAG" sector-rebound-v0.9.28-cqc-aim-debug.apk sector-rebound-v0.9.28-aim-qa-evidence.zip aim-sha256.txt --repo "$REPO" --target d98f1f88f773b2cd53535f81a94290721adb0dac --title 'Sector Rebound v0.9.28 — CQC Aim Feel Android Test' --notes-file notes.md --prerelease
