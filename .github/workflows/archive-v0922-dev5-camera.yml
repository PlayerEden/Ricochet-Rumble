name: Archive exact v0.9.22-dev5 camera QA APK (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-v0922-dev5-camera.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: archive-v0922-dev5-camera-release
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Retrieve exact full-QA APK and Chromium evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run view 40601021890 --repo "$REPO" --json conclusion,headSha --jq '"QA: " + .conclusion + " " + .headSha' > original-QA-provenance.txt
          grep -Fxq 'QA: success 55e69a828f5f791bc7f4244b01b7efddd36ebe3f' original-QA-provenance.txt
          gh run download 40601021890 --repo "$REPO" --name debug-apk-40601021890 --dir original-apk
          gh run download 40601021890 --repo "$REPO" --name sector-rebound-qa-40601021890-1 --dir original-qa
          APK="$(find original-apk -type f -name 'app-debug.apk' | head -n 1)"
          test -n "$APK" && test -s "$APK"
          test "$(find original-qa -type f -name '*.png' | wc -l)" -ge 6
          cp "$APK" sector-rebound-v0.9.22-dev5-final-camera-debug.apk
          (cd original-qa && zip -q -r ../sector-rebound-v0.9.22-dev5-original-QA.zip .)
          sha256sum sector-rebound-v0.9.22-dev5-final-camera-debug.apk sector-rebound-v0.9.22-dev5-original-QA.zip > v0.9.22-dev5-checksums.sha256
      - name: Publish unique, permanent debug pre-release with exact tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=v0.9.22-dev5-final-camera-test
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Refusing to replace existing release or change its source reference."
            exit 1
          fi
          cat > notes.md <<'EOF'
          ## Sector Rebound v0.9.22-dev5 -- final camera phone test (debug build)

          Exact debug APK and source-backed original Chromium QA screenshots from successful [full Android+browser run 40601021890](https://github.com/PlayerEden/Ricochet-Rumble/actions/runs/40601021890), **not recompiled or re-signed here**. Tested source: `55e69a828f5f791bc7f4244b01b7efddd36ebe3f`, [draft PR #24](https://github.com/PlayerEden/Ricochet-Rumble/pull/24). Original checksum manifest included.

          **Camera change only:** pilot 1.07x unchanged, tank 0.87x -> **0.82x**, mech 0.82x -> **0.77x**. Exterior rendered apron increased from 380 to 420 world units for the wide-screen SMALL maze. Same game mechanics, art, UI buttons, audio and LAN state as v0.9.22-dev4. This is not an implemented Close Quarters mode.

          Follow [dev5 phone checklist](https://github.com/PlayerEden/Ricochet-Rumble/blob/main/docs/PLAYTEST_v0922_DEV5_FINAL_CAMERA.md). Verify pilot camera is unchanged, extra world visible in tank/mech, transitions smooth, no blank outside tiles on map edges, readable projectiles and no performance regression. Owner real-device dev5 acceptance is still pending.

          **Important Android debug-signer warning:** Build is debug signed, NOT Google Play production signed. Internal Gradle versionName still `0.9.21-game-feel` and versionCode 38, despite code containing dev5. Debug key can vary between GitHub CI jobs; Android may refuse to install over an older copy. **Uninstalling erases local data/settings**; back up before removing an installed older build. The unsigned AAB is not included for phone installation.

          Preserve [dev4 camera comparison](https://github.com/PlayerEden/Ricochet-Rumble/releases/tag/v0.9.22-dev4-vehicle-camera-test), [dev3](https://github.com/PlayerEden/Ricochet-Rumble/releases/tag/v0.9.22-dev3-camera-test) and v0.9.21 mainline stable release. Draft PR #24 has NOT been merged. Pilot redesign [#26](https://github.com/PlayerEden/Ricochet-Rumble/issues/26) is next after physical camera approval; LAN/audio deferred.
          EOF
          gh release create "$TAG" sector-rebound-v0.9.22-dev5-final-camera-debug.apk sector-rebound-v0.9.22-dev5-original-QA.zip v0.9.22-dev5-checksums.sha256 --repo "$REPO" --target 55e69a828f5f791bc7f4244b01b7efddd36ebe3f --title 'Sector Rebound v0.9.22-dev5 - final tactical camera phone test' --notes-file notes.md --prerelease
