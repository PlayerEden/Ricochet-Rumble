name: Sector Rebound - archive exact v0.9.39 local dossier Android test once
on:
  push:
    branches:
      - feature/player-dossier-local-v0939
    paths:
      - .github/workflows/publish-v0939-exact-qa-once.yml
permissions:
  contents: write
  actions: read
jobs:
  archive-original-passing-artifact:
    if: github.repository == 'PlayerEden/Ricochet-Rumble'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      QA_RUN: '40987749740'
      SOURCE_SHA: '77adb43e8c999fe37d50f8b940612af561d9845a'
      TAG: 'v0.9.39-player-dossier-test'
      APK: 'sector-rebound-v0.9.39-player-dossier-debug.apk'
    steps:
      - name: Refuse wrong source, failed QA, and existing release
        run: |
          set -euo pipefail
          details="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA_RUN")"
          test "$(jq -r '.status' <<< "$details")" = "completed"
          test "$(jq -r '.conclusion' <<< "$details")" = "success"
          test "$(jq -r '.head_sha' <<< "$details")" = "$SOURCE_SHA"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Immutable tag already exists; refusing overwrite" >&2
            exit 1
          fi
      - name: Recover original QA-passing Android APK and browser evidence
        run: |
          set -euo pipefail
          mkdir -p original qa
          gh run download "$QA_RUN" --repo "$GITHUB_REPOSITORY" --name "debug-apk-$QA_RUN" --dir original
          gh run download "$QA_RUN" --repo "$GITHUB_REPOSITORY" --name "sector-rebound-qa-$QA_RUN-1" --dir qa
          test -s original/app-debug.apk
          mv original/app-debug.apk "$APK"
          zip -qr sector-rebound-v0.9.39-player-dossier-qa.zip qa
          sha256sum "$APK" sector-rebound-v0.9.39-player-dossier-qa.zip > v0.9.39-sha256.txt
      - name: Immutable prerelease exact tested bytes without rebuilding
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Preexisting tag; refusing overwrite" >&2
            exit 1
          fi
          {
            echo '# Sector Rebound v0.9.39 — Player Dossier Android Test'
            echo
            echo '**Experimental debug APK: fast regression, Chromium/touch/visual, Android debug APK and unsigned AAB QA PASS. Owner physical phone approval PENDING; not signed for Google Play.**'
            echo
            echo '- New PLAYER DOSSIER shows only genuine completed local Solo-vs-bots rounds, per-mode wins/deaths/draws and pilot KOs.'
            echo '- Independent versioned local save, match deduplication, corrupted save backup, future-version read-only safety and denied-write warning.'
            echo '- Pilot icon milestone eligibility is concept-only. No approved cosmetic item is selectable, equipped, sold or granted.'
            echo '- Quick Play, Custom Match, scoring, AI, procedural maps, LAN, and previously saved settings unchanged.'
            echo '- This APK is the original exact passing QA build, not recompilation or resigning.'
            echo "- Exact tested source SHA: $SOURCE_SHA"
            echo "- Fast CI PASS: https://github.com/$GITHUB_REPOSITORY/actions/runs/40987749714"
            echo "- Full actual Chromium + Android QA PASS: https://github.com/$GITHUB_REPOSITORY/actions/runs/$QA_RUN"
            echo "- Draft PR #58: https://github.com/$GITHUB_REPOSITORY/pull/58"
            echo "- SHA256: $(sha256sum "$APK" | awk '{print $1}')"
            echo
            echo 'Manual Android acceptance, save continuity across upgrades, 2-phone LAN and production signing remain open. Debug signature mismatch can require uninstall, which may erase local progress.'
          } > release-notes.md
          gh release create "$TAG" "$APK" sector-rebound-v0.9.39-player-dossier-qa.zip v0.9.39-sha256.txt --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --prerelease --title "Sector Rebound v0.9.39 — Player Dossier Android Test" --notes-file release-notes.md
