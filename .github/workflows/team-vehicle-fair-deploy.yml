name: Sector Rebound - fair neutral vehicle deployment A/B
on:
  push:
    branches: [experiment/team-vehicle-fair-deploy-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  route-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Android mirror and source safety
        run: |
          cmp web/game.js android/app/src/main/assets/game.js
          cmp web/index.html android/app/src/main/assets/index.html
          cmp web/forward-bays.js android/app/src/main/assets/forward-bays.js
          node --check web/game.js
          node --check tests/team-vehicle-route-qa.mjs
          node tests/smoke.mjs
          node tests/ctf-rules.mjs
          node tests/ctf-objective-ai.mjs
          node tests/save-backup.mjs
      - name: Real maze route fairness, garage and deployment QA
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          npm install --no-save --ignore-scripts playwright-core@1.56.1
          VEHICLE_BALANCE_ENFORCE=1 node tests/team-vehicle-route-qa.mjs
          node tests/team-forward-bays-seed-matrix.mjs
          node tests/forward-bays-live-qa.mjs
          node tests/ctf-objective-bots-live-qa.mjs
          node tests/ctf-natural-match-qa.mjs
          node tests/ctf-contested-human-attack.mjs
          node tests/quick-play-live-flow-qa.mjs
          node tests/backup-stale-export-browser-qa.mjs
          node tests/first-match-entry-browser-qa.mjs
          node tests/ctf-live-qa.mjs
          node tests/visual-qa.mjs
      - name: Archive route-balance results and visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sector-rebound-balanced-vehicle-evidence
          path: |
            qa-results/team-vehicle-route-audit.json
            qa-results/team-forward-bays-seed-matrix.json
            qa-screens/
          if-no-files-found: ignore
          retention-days: 3
