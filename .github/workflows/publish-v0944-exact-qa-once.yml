name: Sector Rebound - archive exact v0.9.44 P-02 visual test once
on:
  push:
    branches:
      - feature/pilot-visual-refinement-v0944
    paths:
      - .github/workflows/publish-v0944-exact-qa-once.yml
permissions:
  contents: write
  actions: read
jobs:
  archive-original-passing-artifact:
    if: github.repository == 'PlayerEden/Ricochet-Rumble'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      QA_RUN: '40999661261'
      SOURCE_SHA: '8fd0f48dfcd43f13dc6e487cd61bd4b7a77b6c85'
      TAG: 'v0.9.44-pilot-visual-test'
      APK: 'sector-rebound-v0.9.44-pilot-refinement-debug.apk'
    steps:
      - name: Fail closed on wrong source SHA, unsuccessful QA or existing tag
        run: |
          set -euo pipefail
          details="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA_RUN")"
          test "$(jq -r '.status' <<< "$details")" = "completed"
          test "$(jq -r '.conclusion' <<< "$details")" = "success"
          test "$(jq -r '.head_sha' <<< "$details")" = "$SOURCE_SHA"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Refusing to replace existing immutable tag" >&2
            exit 1
          fi
      - name: Recover original tested Android APK and Chromium visual snapshots
        run: |
          set -euo pipefail
          mkdir -p original qa
          gh run download "$QA_RUN" --repo "$GITHUB_REPOSITORY" --name "debug-apk-$QA_RUN" --dir original
          gh run download "$QA_RUN" --repo "$GITHUB_REPOSITORY" --name "sector-rebound-qa-$QA_RUN-1" --dir qa
          test -s original/app-debug.apk
          mv original/app-debug.apk "$APK"
          zip -qr sector-rebound-v0.9.44-pilot-refinement-qa.zip qa
          sha256sum "$APK" sector-rebound-v0.9.44-pilot-refinement-qa.zip > v0.9.44-sha256.txt
      - name: Publish original binary as CLEAN-INSTALL-ONLY experimental prerelease
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists" >&2
            exit 1
          fi
          {
            echo '# Sector Rebound v0.9.44 — FIELDGRID P-02 Pilot Visual Test'
            echo
            echo '**EXPERIMENTAL CLEAN-INSTALL DEBUG APK ONLY; real Chromium, regression and Android QA PASS. No owner physical-device approval or production signing.**'
            echo
            echo '- P-02 real top-down pilot renderer: helmet/visor, matched steel armor, mirrored boots/shoulders, two hands on one small pistol.'
            echo '- Shared projectile muzzle still exact at (28,2). FFA neutral steel and real blue/red team painting maintained.'
            echo '- Tank/mech drawings, camera/zoom, aiming, speed, bullet physics, AI, scoring, modes, dossier, backup, LAN and signing logic unchanged.'
            echo '- Internal Android version 0.9.44-pilot-visual-test, code 44, original app ID maintained.'
            echo '- The original APK is COPIED BYTE-FOR-BYTE from passing CI and NEVER rebuilt or re-signed.'
            echo '- Previous test APKs have incompatible signing certificates. THIS DEBUG APK WILL NOT NORMALLY UPDATE OLDER BUILDS IN PLACE.'
            echo '- **DO NOT UNINSTALL your existing Sector Rebound installation if you value its saved profile, settings, or presets.** Clean installation only on expendable test data. Older builds cannot retroactively export through v0.9.40 backup.'
            echo '- User chose to defer owner-private durable test-signing setup until a later development stage.'
            echo "- Original exact tested gameplay SHA: $SOURCE_SHA"
            echo "- Fast regression PASS: https://github.com/$GITHUB_REPOSITORY/actions/runs/40999661362"
            echo "- Full actual Chromium screenshot and Android debug/unsigned bundle QA PASS: https://github.com/$GITHUB_REPOSITORY/actions/runs/$QA_RUN"
            echo "- Draft visual branch PR #63: https://github.com/$GITHUB_REPOSITORY/pull/63"
            echo "- APK SHA256: $(sha256sum "$APK" | awk '{print $1}')"
            echo
            echo 'Actual user Android visual read/feel, two-device LAN and app store signing/privacy remain pending.'
          } > release-notes.md
          gh release create "$TAG" "$APK" sector-rebound-v0.9.44-pilot-refinement-qa.zip v0.9.44-sha256.txt --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --prerelease --title "Sector Rebound v0.9.44 — P-02 Pilot Visual Test (Clean Install)" --notes-file release-notes.md
