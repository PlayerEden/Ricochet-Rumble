name: Sector Rebound - CTF defender lane A-B acceptance
on:
  push:
    branches: [experiment/ctf-defender-lane-clearance-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  defend-lanes:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert Android/browser source parity
        run: |
          cmp web/game.js android/app/src/main/assets/game.js
          cmp web/ctf-ai.js android/app/src/main/assets/ctf-ai.js
          cmp web/ctf-rules.js android/app/src/main/assets/ctf-rules.js
          cmp web/forward-bays.js android/app/src/main/assets/forward-bays.js
      - name: Check deterministic CTF objective rules and gameplay
        run: |
          node tests/ctf-objective-ai.mjs
          node tests/ctf-rules.mjs
          node tests/smoke.mjs
          node tests/save-backup.mjs
      - name: Run full 18-seed A-B cohort and browser regression
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          npm install --no-save --ignore-scripts playwright-core@1.56.1
          node tests/ctf-multiseed-reliability.mjs
          node tests/ctf-objective-bots-live-qa.mjs
          node tests/forward-bays-live-qa.mjs
          node tests/ctf-live-qa.mjs
          node tests/quick-play-live-flow-qa.mjs
          node tests/backup-stale-export-browser-qa.mjs
          node tests/first-match-entry-browser-qa.mjs
          node tests/visual-qa.mjs
      - name: Store defender lane A-B telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sector-rebound-ctf-defender-lanes-ab
          path: |
            qa-results/ctf-multiseed-telemetry.json
            qa-results/ctf-multiseed-summary.json
            qa-screens/
          if-no-files-found: ignore
          retention-days: 3
