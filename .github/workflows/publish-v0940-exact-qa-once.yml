name: Sector Rebound - archive exact v0.9.40 Android readiness test once
on:
  push:
    branches:
      - feature/android-upgrade-readiness-v0940
    paths:
      - .github/workflows/publish-v0940-exact-qa-once.yml
permissions:
  contents: write
  actions: read
jobs:
  archive-original-passing-artifact:
    if: github.repository == 'PlayerEden/Ricochet-Rumble'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      QA_RUN: '40991176203'
      SOURCE_SHA: '8cb4aa9b73aa47c9f4ecf56ecfcf9b67bbe91c5e'
      TAG: 'v0.9.40-upgrade-readiness-test'
      APK: 'sector-rebound-v0.9.40-upgrade-readiness-debug.apk'
    steps:
      - name: Refuse incorrect source, failed QA or existing immutable tag
        run: |
          set -euo pipefail
          details="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA_RUN")"
          test "$(jq -r '.status' <<< "$details")" = "completed"
          test "$(jq -r '.conclusion' <<< "$details")" = "success"
          test "$(jq -r '.head_sha' <<< "$details")" = "$SOURCE_SHA"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Already published; never overwrite" >&2
            exit 1
          fi
      - name: Download exact tested debug APK and original QA screenshots
        run: |
          set -euo pipefail
          mkdir -p original qa
          gh run download "$QA_RUN" --repo "$GITHUB_REPOSITORY" --name "debug-apk-$QA_RUN" --dir original
          gh run download "$QA_RUN" --repo "$GITHUB_REPOSITORY" --name "sector-rebound-qa-$QA_RUN-1" --dir qa
          test -s original/app-debug.apk
          mv original/app-debug.apk "$APK"
          zip -qr sector-rebound-v0.9.40-upgrade-readiness-qa.zip qa
          sha256sum "$APK" sector-rebound-v0.9.40-upgrade-readiness-qa.zip > v0.9.40-sha256.txt
      - name: Create immutable original-binary experimental prerelease
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag exists; refusing overwrite" >&2
            exit 1
          fi
          {
            echo '# Sector Rebound v0.9.40 — Android Upgrade Readiness Test'
            echo
            echo '**EXPERIMENTAL DEBUG APK — automated QA passed. NOT Google Play signed or owner phone approved.**'
            echo
            echo '- Corrected internal Android versionName 0.9.40-upgrade-test, versionCode 40 (previous experimental APK incorrectly identified as 0.9.21 / code 38). Original application ID unchanged.'
            echo '- New Dossier -> BACK UP DATA: offline text export of saved Match Settings, Custom Match rules/presets and player Dossier; manual validated preview and restore with recovery snapshot.'
            echo '- Corrupt/future backups refused; partial writes rolled back; no cloud, accounts, transactions, skins, or external permissions.'
            echo '- Optional release upload signing requires all four owner-supplied environment variables; no keystore provided, and the AAB built in QA remains intentionally unsigned.'
            echo '- Android debug signer from GitHub CI can differ from earlier releases: higher versionCode alone DOES NOT guarantee an in-place update. Uninstall can erase old data.'
            echo '- Old v0.9.39 and earlier versions lack the new BACK UP DATA screen; users must not assume this new feature can retroactively preserve their old installed data.'
            echo '- Original APK copied byte-for-byte from the exact successful full QA; never rebuilt or resigned for release.'
            echo "- Exact tested game/test/build source SHA: $SOURCE_SHA"
            echo "- Fast CI PASS: https://github.com/$GITHUB_REPOSITORY/actions/runs/40991176243"
            echo "- Full real Chromium + Android debug APK + unsigned AAB PASS: https://github.com/$GITHUB_REPOSITORY/actions/runs/$QA_RUN"
            echo "- Draft PR #59: https://github.com/$GITHUB_REPOSITORY/pull/59"
            echo "- APK SHA256: $(sha256sum "$APK" | awk '{print $1}')"
            echo
            echo 'Manual signing-cert comparison, physical in-place update, export/import on real Android, private release keystore setup, two-device LAN and Play review remain OPEN.'
          } > release-notes.md
          gh release create "$TAG" "$APK" sector-rebound-v0.9.40-upgrade-readiness-qa.zip v0.9.40-sha256.txt --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --prerelease --title "Sector Rebound v0.9.40 — Android Upgrade Readiness Test" --notes-file release-notes.md
