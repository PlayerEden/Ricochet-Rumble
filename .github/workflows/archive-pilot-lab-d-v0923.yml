name: Archive exact QA-passed FIELDGRID Pilot Lab D Android test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-pilot-lab-d-v0923.yml']
permissions:
  actions: read
  contents: write
concurrency:
  group: pilot-lab-d-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify exact QA source and download unmodified debug APK/screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run view 40621728355 --repo "$REPO" --json conclusion,headSha --jq '"QA: " + .conclusion + " " + .headSha' > provenance.txt
          grep -Fxq 'QA: success b6d143cd752b3d5019571429e247ea5f01cf6cc5' provenance.txt
          gh run download 40621728355 --repo "$REPO" --name debug-apk-40621728355 --dir original-apk
          gh run download 40621728355 --repo "$REPO" --name sector-rebound-qa-40621728355-1 --dir qa
          APK="$(find original-apk -type f -name 'app-debug.apk' | head -n 1)"
          test -s "$APK"
          cp "$APK" sector-rebound-v0.9.23-pilot-lab-d-fieldgrid-debug.apk
          for kind in on-foot-idle pilot-aim-east pilot-fire; do
            SOURCE="$(find qa -type f -path "*/after/915x412-$kind.png" | head -n 1)"
            test -s "$SOURCE"
            cp "$SOURCE" "lab-d-$kind-915x412.png"
          done
          (cd qa && zip -q -r ../lab-d-original-QA.zip .)
          sha256sum sector-rebound-v0.9.23-pilot-lab-d-fieldgrid-debug.apk lab-d-*.png lab-d-original-QA.zip > lab-d-checksums.sha256
      - name: Publish one immutable debug-only Lab D prerelease without recompiling
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=v0.9.23-pilot-lab-d-fieldgrid-test
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Existing release/tag: refusing destructive overwrite";exit 1
          fi
          cat > notes.md <<'EOF'
          # Sector Rebound — Pilot Lab D FIELDGRID Operator art test

          **Experimental visual prototype: NOT owner-approved, NOT main-merged and NOT Play signed.** The user liked the strict overhead, two-handed pose of Lab C2 but found too many circular shapes. Lab D replaces smooth round shoulder caps and helmet with original faceted armored helmet, compact trapezoid torso, angular shoulders/forearms, two attached gloves and FIELDGRID-style corner targeting brackets. The temporary spawn/ejection shield still displays real protection rather than permanent decorative rings.

          **Exact tested source SHA:** `b6d143cd752b3d5019571429e247ea5f01cf6cc5` on [Lab D prototype branch](https://github.com/PlayerEden/Ricochet-Rumble/tree/prototype/pilot-fieldgrid-lab-d-v0923). [Full QA run 40621728355 PASS](https://github.com/PlayerEden/Ricochet-Rumble/actions/runs/40621728355) includes original Chromium game scenes at 740×360, 915×412, 1280×720, game regression, browser/Android source parity, APK and **unsigned** AAB builds. This APK is the unchanged artifact from that exact QA run, NOT rebuilt or re-signed by the publication workflow. SHA-256 manifest supplied.

          **Gameplay locked:** pilot zoom 1.07, tank 0.82, mech 0.77; shared true sidearm muzzle point (28,2) and wall-safe trace; shot speed/damage, camera apron, hitboxes, movement, UI/joystick, vehicle renderers, LAN and Quick Play rules all unchanged. Lab D changes are visual only. [Lab C2 rollback/prior test APK](https://github.com/PlayerEden/Ricochet-Rumble/releases/tag/v0.9.23-pilot-lab-c2-two-hand-test) and [camera dev5](https://github.com/PlayerEden/Ricochet-Rumble/releases/tag/v0.9.22-dev5-final-camera-test) remain intact.

          **Owner review requested:** compare the real 915×412 Lab D screenshots (idle, aim east and fire) against Lab C2, then inspect actual Android device landscape with movement, four facings, firing and ejection. Automated screenshot capture is NOT human aesthetic acceptance. [Draft PR #31](https://github.com/PlayerEden/Ricochet-Rumble/pull/31) remains dependent on unmerged [PR #24](https://github.com/PlayerEden/Ricochet-Rumble/pull/24) and must not be merged yet.

          **Install warning:** this is a debug-signed CI test APK with legacy internal Android `versionName`. Debug signing certificates may differ and Android may refuse an in-place upgrade. Uninstalling an installed game can erase local settings/data. Do not confuse this preview with a signed Google Play app.
          EOF
          gh release create "$TAG" sector-rebound-v0.9.23-pilot-lab-d-fieldgrid-debug.apk lab-d-on-foot-idle-915x412.png lab-d-pilot-aim-east-915x412.png lab-d-pilot-fire-915x412.png lab-d-original-QA.zip lab-d-checksums.sha256 --repo "$REPO" --target b6d143cd752b3d5019571429e247ea5f01cf6cc5 --title 'Sector Rebound v0.9.23 — Pilot Lab D FIELDGRID Operator Android test' --notes-file notes.md --prerelease
