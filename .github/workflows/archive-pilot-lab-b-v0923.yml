name: Archive exact overhead pilot Lab B APK and QA screenshots (one-time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-pilot-lab-b-v0923.yml']
permissions:
  actions: read
  contents: write
concurrency:
  group: archive-pilot-lab-b
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download tested Android debug APK and original browser screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run view 40608326490 --repo "$REPO" --json conclusion,headSha --jq '"QA: " + .conclusion + " " + .headSha' | tee source-QA.txt
          grep -Fxq 'QA: success 5eb12fb600d9a423a67c2f1d414db792d371a338' source-QA.txt
          gh run download 40608326490 --repo "$REPO" --name pilot-prototype-debug-apk-40608326490 --dir original-apk
          gh run download 40608326490 --repo "$REPO" --name pilot-silhouette-qa-40608326490 --dir original-qa
          APK="$(find original-apk -type f -name 'app-debug.apk' | head -n 1)"
          test -s "$APK"
          cp "$APK" sector-rebound-v0.9.23-pilot-lab-b-overhead-debug.apk
          for type in before after; do
            INPUT="$(find original-qa -type f -path "*/$type/915x412-on-foot-idle.png" | head -n 1)"
            test -s "$INPUT"
            cp "$INPUT" pilot-lab-b-$type-915x412.png
          done
          (cd original-qa && zip -q -r ../pilot-lab-b-real-game-QA.zip .)
          sha256sum sector-rebound-v0.9.23-pilot-lab-b-overhead-debug.apk pilot-lab-b-before-915x412.png pilot-lab-b-after-915x412.png pilot-lab-b-real-game-QA.zip > lab-b-sha256.txt
      - name: Immutable Lab B release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=v0.9.23-pilot-lab-b-overhead-test
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo 'Existing release found; refusing overwrite'
            exit 1
          fi
          cat > notes.md <<'EOF'
          # Sector Rebound v0.9.23 PILOT LAB B -- TRUE TOP-DOWN EXPERIMENT

          **Unapproved experimental player art -- NOT an accepted production update.** Owner rejected Lab A on an actual phone because the character resembled someone low-crawling or a 2.5D turret. Lab B instead uses a **strict 90-degree-overhead helmet top + two shoulders**. The compact vest is mostly hidden, with **no trailing legs** and only a small off-center sidearm. Research: overhead views of Hotline Miami, Police Stories, Door Kickers 2 and general overhead/3-4 perspective principles. **No external sprites or protected art copied.**

          Original code: [isolated prototype/pilot-true-overhead-v0923 branch](https://github.com/PlayerEden/Ricochet-Rumble/tree/prototype/pilot-true-overhead-v0923). Full successful [gameplay, Chromium and Android QA run 40608326490](https://github.com/PlayerEden/Ricochet-Rumble/actions/runs/40608326490), **exact source `5eb12fb600d9a423a67c2f1d414db792d371a338`**. Uploaded APK is THE artifact from passing QA without rebuilding or re-signing. Included SHA256, original browser before/after at 915×412 and full 740×360 / 915×412 / 1280×720 scenario screenshot ZIP.

          ### User phone check
          1. Exit tank, look at idle pilot from normal phone viewing distance. Does it read as **head and shoulders viewed from above**, not a robot/crawling soldier?
          2. Walk/turn in all directions, aim and fire. The shoulders should communicate human orientation; no overlong legs/torso.
          3. Check whether shield ring, on-foot ID, arrow or weapon still dominate the person. The camera is unchanged at **pilot 1.07**, tank **0.82**, mech **0.77**.
          4. Normal gameplay, hitboxes, movement, ejection, vehicles, bots, After Action and playlist selections are unchanged. This build has **no new game mode or portrait asset**.
          5. Give yes/no on silhouette and comments. If it still resembles hardware, make a cleaner Lab C rather than trying another faux-depth silhouette.

          ### Build identity and warnings
          This is a **debug APK** and the Android app's embedded versionName may still show `0.9.21-game-feel`. Debug signing certificate may differ from previously installed builds, so Android could refuse to update over an older package. **Uninstalling erases local app data and settings.** This package is NOT Play signed, not an accepted mainline merge. The old [dev5 camera build](https://github.com/PlayerEden/Ricochet-Rumble/releases/tag/v0.9.22-dev5-final-camera-test) and [Lab A comparison](https://github.com/PlayerEden/Ricochet-Rumble/releases/tag/v0.9.23-pilot-lab-a-test) remain preserved. Draft [PR #24](https://github.com/PlayerEden/Ricochet-Rumble/pull/24) is still separate, open and unmerged.
          EOF
          gh release create "$TAG" sector-rebound-v0.9.23-pilot-lab-b-overhead-debug.apk pilot-lab-b-before-915x412.png pilot-lab-b-after-915x412.png pilot-lab-b-real-game-QA.zip lab-b-sha256.txt --repo "$REPO" --target 5eb12fb600d9a423a67c2f1d414db792d371a338 --title 'Sector Rebound v0.9.23 Pilot Lab B -- direct overhead Android art test' --notes-file notes.md --prerelease
