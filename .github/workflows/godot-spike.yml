name: Sector Rebound - Godot prototype headless QA
on:
  push:
    branches: [experiment/godot-ricochet-trials-spike]
    paths:
      - 'experiments/godot-ricochet-spike/**'
      - '.github/workflows/godot-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-headless-spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download official pinned Godot 4.7.2 stable binary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error             https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip             --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --version
      - name: Import standalone trial scene with Godot
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless             --path experiments/godot-ricochet-spike --editor --quit
      - name: Execute GDScript headless physics/rules smoke
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless             --path experiments/godot-ricochet-spike --script res://tests/smoke.gd             2>&1 | tee "$RUNNER_TEMP/godot-spike.log"
          grep -q GODOT_RICOCHET_SPIKE_HEADLESS_SMOKE_PASS "$RUNNER_TEMP/godot-spike.log"
