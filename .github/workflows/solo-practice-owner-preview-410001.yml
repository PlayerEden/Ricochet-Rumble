name: Sector Rebound - Solo practice same-signer owner QA APK
# One-shot: only the reviewed introduction of this workflow to main runs it.
# Changing arbitrary game source does not rebuild or silently ship an owner APK.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/solo-practice-owner-preview-410001.yml']

permissions:
  contents: read

concurrency:
  group: sector-rebound-solo-practice-410001-internal-apk
  cancel-in-progress: false

jobs:
  build-internal-owner-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: One-run reviewed-main and unchanged-runtime gate
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_RUN_NUMBER" = "1"
          BASE=ae00b9b27743d10dca9f2c8f0c951be3ec447603
          git merge-base --is-ancestor "$BASE" HEAD
          # Subsequent docs and this workflow may differ; gameplay, package
          # and test source must still be identical to the reviewed Solo practice PR.
          git diff --quiet "$BASE" HEAD -- web/ android/ game-data/ tests/
          test -n "$GITHUB_SHA"
          node --check web/game.js
          node --check tests/m2-camera-widen-qa.mjs
          node --check tests/solo-practice-onboarding.mjs
          node tests/smoke.mjs
          node tests/dossier.mjs
          node tests/save-backup.mjs
          node tests/android-upgrade-readiness.mjs
          node tests/lan-framing-contract.mjs
          for asset in game.js index.html style.css scored-match.js dossier.js save-backup.js ctf-rules.js ctf-ai.js forward-bays.js lan-series.js lan-room.js; do
            cmp "web/$asset" "android/app/src/main/assets/$asset"
          done
      - name: Install official Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Recover pinned PUBLIC AOSP development test signer (not production)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/solo-practice-signing"
          base="https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security"
          for name in testkey.pk8 testkey.x509.pem; do
            curl --fail --show-error --silent --location --retry 3 "$base/$name?format=TEXT" | base64 --decode > "$RUNNER_TEMP/solo-practice-signing/$name"
            test -s "$RUNNER_TEMP/solo-practice-signing/$name"
          done
          test "$(git hash-object "$RUNNER_TEMP/solo-practice-signing/testkey.pk8")" = "586c1bd5cf96f9358f36b37ea98fef93f4d0a8e3"
          test "$(git hash-object "$RUNNER_TEMP/solo-practice-signing/testkey.x509.pem")" = "e242d83e2bf72169ab0abd5280d4d455caef71eb"
          openssl pkcs8 -inform DER -nocrypt -in "$RUNNER_TEMP/solo-practice-signing/testkey.pk8" -out "$RUNNER_TEMP/solo-practice-signing/public.key.pem"
          openssl pkcs12 -export -inkey "$RUNNER_TEMP/solo-practice-signing/public.key.pem" \
            -in "$RUNNER_TEMP/solo-practice-signing/testkey.x509.pem" \
            -out "$RUNNER_TEMP/solo-practice-signing/public-testkey.p12" \
            -name aosp-public-testkey -passout pass:disposable-preview-only
          test -s "$RUNNER_TEMP/solo-practice-signing/public-testkey.p12"
          echo "SR_TEST_STORE_FILE=$RUNNER_TEMP/solo-practice-signing/public-testkey.p12" >> "$GITHUB_ENV"
          echo "SR_TEST_STORE_PASSWORD=disposable-preview-only" >> "$GITHUB_ENV"
          echo "SR_TEST_KEY_ALIAS=aosp-public-testkey" >> "$GITHUB_ENV"
          echo "SR_TEST_KEY_PASSWORD=disposable-preview-only" >> "$GITHUB_ENV"
      - name: Build preview v0.9.79 Solo practice with strictly higher versionCode
        working-directory: android
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug \
            -PsrPreviewPackage=true \
            -PsrPreviewVersionCode=410001 \
            -PsrPreviewVersionName=0.9.79-practice.1
      - name: Verify certificate, package identity, upgrade code, exact assets and SHA
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$signer" verify --min-sdk-version 26 --print-certs "$apk" > "$RUNNER_TEMP/solo-practice-signing/cert.txt"
          actual="$(sed -nE 's/.*Signer #1 certificate SHA-256 digest: ([a-fA-F0-9:]+).*$/\1/p' "$RUNNER_TEMP/solo-practice-signing/cert.txt" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          expected="$(openssl x509 -in "$RUNNER_TEMP/solo-practice-signing/testkey.x509.pem" -outform DER | sha256sum | awk '{print $1}')"
          pin=a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc
          test "$actual" = "$expected"
          test "$actual" = "$pin"
          metadata="$("$aapt" dump badging "$apk" | head -n 1)"
          [[ "$metadata" == *"name='com.playereden.ricochetrumble.preview'"* ]]
          [[ "$metadata" == *"versionCode='410001'"* ]]
          [[ "$metadata" == *"versionName='0.9.79-practice.1'"* ]]
          for asset in game.js index.html style.css scored-match.js dossier.js save-backup.js ctf-rules.js ctf-ai.js forward-bays.js lan-series.js lan-room.js; do
            cmp "web/$asset" <(unzip -p "$apk" "assets/$asset")
          done
          mkdir -p dist
          cp "$apk" dist/sector-rebound-solo-practice-410001.apk
          {
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "GAMEPLAY_REVIEWED_SHA=ae00b9b27743d10dca9f2c8f0c951be3ec447603"
            echo "APPLICATION_ID=com.playereden.ricochetrumble.preview"
            echo "VERSION_NAME=0.9.79-practice.1"
            echo "VERSION_CODE=410001"
            echo "PUBLIC_AOSP_CERT_SHA256=$actual"
            echo "APK_SHA256=$(sha256sum dist/sector-rebound-solo-practice-410001.apk | awk '{print $1}')"
            echo "INTERNAL_DEV_TEST_ONLY_NOT_GOOGLE_PLAY"
            echo "TWO_PHONE_WIFI_AND_REAL_INSTALL_OVER_NOT_YET_ACCEPTED"
          } > dist/verification.txt
          echo "SOLO_PRACTICE_PREVIEW_410001_SIGNER_PACKAGE_ASSETS_PASS"
      - name: Upload installable INTERNAL APK and provenance, not public release
        uses: actions/upload-artifact@v4
        with:
          name: sector-rebound-solo-practice-owner-preview-410001
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Erase temporary AOSP test-signing materials
        if: always()
        run: rm -rf "$RUNNER_TEMP/solo-practice-signing"
