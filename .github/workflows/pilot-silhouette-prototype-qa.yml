name: FIELDGRID pilot silhouette prototype — Android + before/after QA
on:
  push:
    branches: [prototype/pilot-human-silhouette-v0923, prototype/pilot-true-overhead-v0923, prototype/pilot-two-hand-muzzle-v0923]
    paths:
      - '.github/workflows/pilot-silhouette-prototype-qa.yml'
      - 'web/game.js'
      - 'android/app/src/main/assets/game.js'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-silhouette-prototype-qa
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android 36 SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Game regressions, pilot art geometry checks, and exact bundled parity
        run: |
          set -euo pipefail
          node --check web/game.js
          node tests/smoke.mjs
          node tools/validate-cosmetic-catalog.mjs
          cmp web/game.js android/app/src/main/assets/game.js
          cmp web/index.html android/app/src/main/assets/index.html
          cmp web/style.css android/app/src/main/assets/style.css
      - name: Compare against current v0.9.22 game source (same arena seed)
        uses: actions/checkout@v4
        with:
          ref: dev/sector-rebound-quick-play-v0922
          path: visual-baseline
      - name: Actual Chromium phone screens — pilot before/after and live movement
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          export CHROME_BIN
          test -n "$CHROME_BIN"
          npm install --no-save --ignore-scripts playwright-core@1.56.1
          node tests/visual-qa.mjs
      - name: Upload actual UI screenshots and simulation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-silhouette-qa-${{ github.run_id }}
          path: |
            qa-screens/
            qa-results/combat-simulation.json
          if-no-files-found: warn
          retention-days: 14
      - name: Assemble Android debug APK for experimental phone testing
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload experimental debug APK (not Play signed)
        uses: actions/upload-artifact@v4
        with:
          name: pilot-prototype-debug-apk-${{ github.run_id }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
