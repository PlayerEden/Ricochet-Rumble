name: Archive QA-proven Pilot Lab E arcade and modular art
on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-pilot-lab-e-v0924.yml']
permissions:
  actions: read
  contents: write
concurrency:
  group: pilot-lab-e-preview-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify exact QA source and preserve original artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run view 40624575272 --repo "$REPO" --json conclusion,headSha --jq '"QA: " + .conclusion + " " + .headSha' > provenance.txt
          grep -Fxq 'QA: success e01b5b1a4b335115f803e10ae3001de8d33aea5b' provenance.txt
          gh run download 40624575272 --repo "$REPO" --name debug-apk-40624575272 --dir original-apk
          gh run download 40624575272 --repo "$REPO" --name sector-rebound-qa-40624575272-1 --dir qa
          APK="$(find original-apk -type f -name 'app-debug.apk' | head -n 1)"
          test -s "$APK"
          cp "$APK" sector-rebound-v0.9.24-pilot-lab-e-arcade-debug.apk
          for kind in on-foot-idle on-foot-walking pilot-aim-east pilot-fire; do
            SOURCE="$(find qa -type f -path "*/after/915x412-$kind.png" | head -n 1)"
            test -s "$SOURCE"
            cp "$SOURCE" "lab-e-$kind-915x412.png"
          done
          (cd qa && zip -q -r ../lab-e-original-QA.zip .)
          sha256sum sector-rebound-v0.9.24-pilot-lab-e-arcade-debug.apk lab-e-*.png lab-e-original-QA.zip > lab-e-checksums.sha256
      - name: Publish immutable debug-only Lab E arcade pilot prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=v0.9.24-pilot-lab-e-arcade-test
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Existing tag -- refusing destructive overwrite";exit 1
          fi
          cat > notes.md <<'EOF'
          # Sector Rebound Pilot Lab E — arcade pilot + modular unit paint foundation

          **Experimental playable art build; owner phone-art acceptance NOT YET RECEIVED.** Based on [owner screenshot feedback](https://github.com/PlayerEden/Ricochet-Rumble/issues/26) that Lab D operator appears higher-detail than old-school arcade tank/mech art, Lab E builds a chunky strict-top-down helmet, paired square shoulder blocks, stepped bent forearms/gloves and existing two-hand pistol with three-value armor panels.

          **Four fixed future material palettes** (`fieldgrid.standard/moss/dune/oxide`) are rendered through one shared named-material interface for pilot, tank and mech. The normal tank/mech default geometry, team painting, lights and shadows remain the previous values. No palette selector, cosmetics purchase, save/profile, networking change or live skin ownership is included. This is a foundation for future colors, NOT a shipped cosmetic store.

          **Proven exact source:** [prototype/pilot-lab-e-arcade-modular-v0924](https://github.com/PlayerEden/Ricochet-Rumble/tree/prototype/pilot-lab-e-arcade-modular-v0924), verified code SHA `e01b5b1a4b335115f803e10ae3001de8d33aea5b`. [Full gameplay, actual Chromium screenshots and Android debug APK/unsigned AAB build 40624575272 PASSED](https://github.com/PlayerEden/Ricochet-Rumble/actions/runs/40624575272), with [fast smoke CI](https://github.com/PlayerEden/Ricochet-Rumble/actions/runs/40624575300) also successful. APK copied **unchanged from the actual passing QA run**, not rebuilt or re-signed. SHA256 checksums and original multi-resolution screenshot ZIP included.

          **Fixed physics/camera:** shared pistol muzzle (28,2) and wall-safe bullet trace; pilot 1.07, tank 0.82, mech 0.77; all hitboxes, collision, projectile rules, procedural mazes, touch, LAN and Quick Play behavior unchanged. This is visual-only source work. **No branch integration or mainline merge** implied; [draft Lab E PR #32](https://github.com/PlayerEden/Ricochet-Rumble/pull/32) inherits experimental PR #31 and unmerged Quick Play #24. [Lab D prior-release APK/screen shots](https://github.com/PlayerEden/Ricochet-Rumble/releases/tag/v0.9.23-pilot-lab-d-fieldgrid-test) remain rollback and comparison.

          **Human phone review:** compare original Lab D and Lab E actual 915×412 idle, walking, aiming and firing captures, and play the new debug APK on device. Evaluate whether pilot now shares the old-school arcade tank style and whether arms, two hands and muzzle remain readable. Automated QA does not certify artistic approval.

          **Installation caution:** debug signed for testing, not Google Play signed. The Android internal versionName remains older; a different CI signing certificate may refuse in-place installation, and uninstalling the previous version could erase local game data.
          EOF
          gh release create "$TAG" sector-rebound-v0.9.24-pilot-lab-e-arcade-debug.apk lab-e-on-foot-idle-915x412.png lab-e-on-foot-walking-915x412.png lab-e-pilot-aim-east-915x412.png lab-e-pilot-fire-915x412.png lab-e-original-QA.zip lab-e-checksums.sha256 --repo "$REPO" --target e01b5b1a4b335115f803e10ae3001de8d33aea5b --title 'Sector Rebound v0.9.24 — Pilot Lab E arcade Android art test' --notes-file notes.md --prerelease
