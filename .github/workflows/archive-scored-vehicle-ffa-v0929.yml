name: Archive QA-tested Sector Rebound Scored Vehicle FFA APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-scored-vehicle-ffa-v0929.yml']
permissions:
  actions: read
  contents: write
concurrency:
  group: archive-vehicle-ffa-v0929
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download exact successful QA APK without recompiling or resigning
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PROOF="$(gh run view 40638575751 --repo "$REPO" --json conclusion,headSha --jq '.conclusion + " " + .headSha')"
          test "$PROOF" = "success d9933a8edb585b05d71408cd1cff9a867f6710ea"
          gh run download 40638575751 --repo "$REPO" --name debug-apk-40638575751 --dir qa-apk
          gh run download 40638575751 --repo "$REPO" --name sector-rebound-qa-40638575751-1 --dir qa-evidence
          FILE="$(find qa-apk -type f -name 'app-debug.apk' -print -quit)"
          test -s "$FILE"
          cp "$FILE" sector-rebound-v0.9.29-scored-vehicle-ffa-debug.apk
          (cd qa-evidence && zip -q -r ../sector-rebound-v0.9.29-scored-ffa-qa.zip .)
          sha256sum sector-rebound-v0.9.29-scored-vehicle-ffa-debug.apk sector-rebound-v0.9.29-scored-ffa-qa.zip > scored-ffa-sha256.txt
      - name: Publish first QA-passed scored vehicle FFA Android test
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=v0.9.29-scored-vehicle-ffa-test
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then echo "Release exists; refusing overwrite"; exit 1; fi
          cat > release-notes.md <<'EOF'
          # Sector Rebound v0.9.29 — Scored Vehicle Free-for-All

          **Experimental Android debug APK, not merged into stable main or signed for Google Play.** Based on the owner-approved v0.9.28 Close Quarters aiming controls (described as WAY better; slight future tuning deferred).

          ## New playable scored mode

          Main menu: **SCORED FREE-FOR-ALL · VEHICLES · KO TARGET · TEST**.

          - 1 human and 3 AI opponents in a new **STANDARD procedural maze** each match, all starting inside tanks. Spare tanks and a mech can be found and entered; vehicle deployments continue.
          - **First to 10 genuine pilot KOs wins, or after four active minutes the highest individual score wins**; tied top scores produce a DRAW.
          - **Tank armor hits, armor break and ejecting a pilot do NOT count as a KO.** Only truly killing the vulnerable **on-foot pilot** awards the point. Pilot ejection retains the brief shield. No permanent life elimination: pilots safely respawn on foot and can enter other vehicles.
          - Existing scored KO engine, short protected respawn, score+leader HUD, pause-aware clock and accurate After Action are shared with pilot-only CQC.
          - **NEXT MATCH** creates a fresh procedural scored vehicle FFA battle with new score and timer. Ordinary finite-life Solo/Team Survival and pilot-only CQC remain separate and available.
          - CQC thumb-aim refinement stays intact. In scored vehicle FFA the independent FIRE drag applies while on foot; tanks/mechs use original vehicle steering/aiming.

          ## Verification and rollback

          - [Fast 300-seed+legacy CQC/Survival+real vehicle FFA armor-eject-pilot-KO and respawn checks: PASS 40638575991](https://github.com/PlayerEden/Ricochet-Rumble/actions/runs/40638575991).
          - [Full real Chromium including actual scored FFA lobby→armor/eject→10 pilot KOs→After Action→NEXT MATCH→4m DRAW, mobile views, plus Android debug APK & unsigned AAB: PASS 40638575751](https://github.com/PlayerEden/Ricochet-Rumble/actions/runs/40638575751).
          - **Exact QA-tested source:** `d9933a8edb585b05d71408cd1cff9a867f6710ea`, [DRAFT feature PR #46](https://github.com/PlayerEden/Ricochet-Rumble/pull/46). The APK was copied BYTE-FOR-BYTE from that successful build; not rebuilt or resigned.
          - QA screenshot ZIP and SHA-256 checksums included.
          - Known-good owner-approved [v0.9.28 CQC Aim Feel APK](https://github.com/PlayerEden/Ricochet-Rumble/releases/tag/v0.9.28-cqc-aim-feel-test) remains available for rollback.

          ## Phone playtest requested

          Compare the new scored FFA to CQC: does vehicle armor/ejection make the **10-KO / 4-minute** limit too slow? Do bot vehicle tactics feel fair? Are the scores correct (armor/ejection never counts)? Can you leave a tank, re-enter another, and survive a scored respawn? Does the HUD fit your landscape screen?

          **Known limitations:** Full natural-match balancing and 50+ bot games not established, LAN scored/online PvP untested, no custom match rules/editor yet. Android internal debug version metadata is still older and debug signing cert may change. If installing over a previous debug build fails, uninstalling can erase local preferences. Stable main remains v0.9.21 until deliberately reviewed and merged; no production signed AAB.
          EOF
          gh release create "$TAG" sector-rebound-v0.9.29-scored-vehicle-ffa-debug.apk sector-rebound-v0.9.29-scored-ffa-qa.zip scored-ffa-sha256.txt --repo "$REPO" --target d9933a8edb585b05d71408cd1cff9a867f6710ea --title 'Sector Rebound v0.9.29 — Scored Vehicle FFA Android Test' --notes-file release-notes.md --prerelease
