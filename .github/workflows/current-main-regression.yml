name: Sector Rebound - canonical mainline gameplay and LAN regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'android/**'
      - 'tests/**'
      - 'game-data/**'
      - '.github/workflows/current-main-regression.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'android/**'
      - 'tests/**'
      - 'game-data/**'
      - '.github/workflows/current-main-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sr-current-main-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax and exact Android WebView asset parity
        run: |
          set -euo pipefail
          for f in game.js index.html style.css scored-match.js dossier.js save-backup.js ctf-rules.js ctf-ai.js forward-bays.js lan-series.js lan-room.js; do
            cmp "web/$f" "android/app/src/main/assets/$f"
          done
          node --check web/game.js
          node --check web/lan-room.js
          node --check tests/bot-rare-opportunities-m2-a2.mjs
          node --check tests/ai-aim-posture-m2-a1.mjs
          node --check tests/m2-camera-widen-qa.mjs
          node --check tests/solo-practice-onboarding.mjs
          node --check tests/backup-share-ui.mjs
          node --check tests/android-focus-pause-qa.mjs
          node --check tests/one-phone-local-relaunch-qa.mjs
          node --check tests/android-canvas-resize-qa.mjs
          node --check tests/reward-hangar-navigation-qa.mjs
          node --check tests/m9-results-layout-qa.mjs
          node --check tests/landscape-hud-safe-zones-qa.mjs
      - name: Run pure room, gameplay, save, update and ballistic safeguards
        run: |
          set -euo pipefail
          node tests/lan-room-state-d3-a0.mjs
          node tests/lan-series-kernel.mjs
          node tests/smoke.mjs
          node tests/scored-match-kernel.mjs
          node tests/ballistic-trace-a2.mjs
          node tests/save-backup.mjs
          node tests/android-upgrade-readiness.mjs
          node tests/test-signer-contract.mjs
      - name: Install real Chromium test harness
        run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Verify latest bot feel, pilot fairness, host-alone LAN and legacy two-client flow
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          node tests/bot-rare-opportunities-m2-a2.mjs
          node tests/ai-aim-posture-m2-a1.mjs
          node tests/bot-shot-parity-qa.mjs
          node tests/pilot-combat-fairness-qa.mjs
          node tests/bot-combat-cues-qa.mjs
          node tests/lan-modes-d3-a2.mjs
          node tests/lan-host-bots-d3-a1.mjs
          node tests/lan-lobby-flow-qa.mjs
          node tests/solo-practice-onboarding.mjs
          node tests/backup-share-ui.mjs
          node tests/android-focus-pause-qa.mjs
          node tests/one-phone-local-relaunch-qa.mjs
          node tests/android-canvas-resize-qa.mjs
          node tests/reward-hangar-navigation-qa.mjs
          node tests/m9-results-layout-qa.mjs
          node tests/landscape-hud-safe-zones-qa.mjs
          node tests/ui-layout-geometry-v0948.mjs
          node tests/visual-qa.mjs
          node tests/m2-camera-widen-qa.mjs
      - name: Preserve inspectable QA outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sector-rebound-canonical-regression-${{ github.run_id }}
          path: |
            qa-results/
            qa-screens/
            qa-layout/
          retention-days: 21
          if-no-files-found: warn
