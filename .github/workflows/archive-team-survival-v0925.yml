name: Archive tested Team Survival AI ally and team colors APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-team-survival-v0925.yml']
permissions:
  actions: read
  contents: write
concurrency:
  group: team-survival-ally-qa-release
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify exact passing QA and copy unchanged APK/screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run view 40629089577 --repo "$REPO" --json conclusion,headSha --jq '"QA: " + .conclusion + " " + .headSha' > provenance.txt
          grep -Fxq 'QA: success 96be4c0540419d909a5ca20b444a1841d7354834' provenance.txt
          gh run download 40629089577 --repo "$REPO" --name debug-apk-40629089577 --dir original-apk
          gh run download 40629089577 --repo "$REPO" --name sector-rebound-qa-40629089577-1 --dir qa
          APK="$(find original-apk -type f -name 'app-debug.apk' | head -n 1)"
          test -s "$APK"
          cp "$APK" sector-rebound-v0.9.25-team-survival-allies-debug.apk
          for kind in arena on-foot-idle pilot-aim-east pilot-fire; do
            SOURCE="$(find qa -type f -path "*/after/915x412-$kind.png" | head -n 1)"
            test -s "$SOURCE"
            cp "$SOURCE" "team-survival-$kind-915x412.png"
          done
          (cd qa && zip -q -r ../team-survival-original-QA.zip .)
          sha256sum sector-rebound-v0.9.25-team-survival-allies-debug.apk team-survival-*.png team-survival-original-QA.zip > team-survival-checksums.sha256
      - name: Publish debug test prerelease without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=v0.9.25-team-survival-allies-test
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then echo "Release already exists -- refusing overwrite";exit 1; fi
          cat > notes.md <<'EOF'
          # Sector Rebound v0.9.25 — Team Survival AI Allies and Blue/Red Units Test

          **Experimental owner phone build, not Play-signed, not approved or merged to main.**

          Owner confirmed NEXT MATCH rotates modes, but Team Survival was actually a human-vs-every-bot match and occupied tanks/mechs lacked matching team colors. This test build corrects it:

          - TEAM SURVIVAL: Blue player + allied Blue bots, Red enemy bots; default 2 bot setting = Player + AI2 Blue versus AI1 Red. AI keeps ignoring friendlies, and allied pilots have matching team-color armour/helmets, occupied tanks, mechs, radar, shield and bullet indicators. Red side only shown in enemy HUD count.
          - If the player loses all lives but Blue AI wins, BLUE victory is correctly reported with 0 personal lives remaining.
          - One selected bot becomes two **only for Team Survival** so at least one ally and one opponent exist. User-selected **0 bots** remains legitimate empty-field practice; FFA still uses exact bot count, including after NEXT MATCH switches back from teams.
          - The actual mode is still **last-team-standing TEAM SURVIVAL**, *not* scored/respawning Team Deathmatch. True TDM is future [issue #36](https://github.com/PlayerEden/Ricochet-Rumble/issues/36). Pilot-versus-vehicle balance remains deferred [#33](https://github.com/PlayerEden/Ricochet-Rumble/issues/33).
          - No change to pilot muzzle (28,2), projectile speed, actor hitboxes, vehicle armor, tested camera zoom 1.07 / 0.82 / 0.77, apron 420, procedural generation architecture, signing, monetization, or LAN messages.

          **Exact verified source commit:** `96be4c0540419d909a5ca20b444a1841d7354834` on [draft PR #35](https://github.com/PlayerEden/Ricochet-Rumble/pull/35). [**Full real Chromium screenshot/live match-flow and Android APK/AAB QA PASS 40629089577**](https://github.com/PlayerEden/Ricochet-Rumble/actions/runs/40629089577), plus fast PR regression. **The released APK is the original artifact from this exact passing workflow, not recompiled or re-signed**. Visual screenshot ZIP and hashes included. 915×412 images are generic gameplay probes; they do not by themselves prove team-color proportions with multiple bots, so actual Android gameplay feedback is required.

          **Phone review:** Pick TEAM SURVIVAL and 2 or more bots in Match Settings. Confirm the Blue player and Blue 'ALLY' AI, Red enemy tank/mech/pilot, no team fire, HUD enemy count, and next match switching back to normal FFA. Please verify team win after the player dies as feasible. [Lab E previous test APK / rollback](https://github.com/PlayerEden/Ricochet-Rumble/releases/tag/v0.9.24-pilot-lab-e-arcade-test) remains available.

          **Install warning:** CI debug-signed, internal Android versionName is still older; different signing certificates may prevent in-place upgrades. Uninstalling older versions can erase locally saved data.
          EOF
          gh release create "$TAG" sector-rebound-v0.9.25-team-survival-allies-debug.apk team-survival-arena-915x412.png team-survival-on-foot-idle-915x412.png team-survival-pilot-aim-east-915x412.png team-survival-pilot-fire-915x412.png team-survival-original-QA.zip team-survival-checksums.sha256 --repo "$REPO" --target 96be4c0540419d909a5ca20b444a1841d7354834 --title 'Sector Rebound v0.9.25 — Team Survival ally and team-color Android test' --notes-file notes.md --prerelease
