name: Archive original QA-tested v0.9.54 LAN safety APK
on:
  push:
    branches: [fix/lan-guest-input-timeout-v0954]
    paths:
      - '.github/workflows/archive-v0954-lan.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: sector-rebound-v0954-original-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify original successful CI source and unused prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN=41156274497
          SHA=e4cb3e2e9351f1c2a354b35100f23bf0bd9e45a0
          TAG=v0.9.54-lan-ghost-input-test
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .head_sha)" = "$SHA"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing experimental release" >&2
            exit 1
          fi
      - name: Copy unchanged original debug APK and screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 41156274497 --repo "$GITHUB_REPOSITORY" --name debug-apk-41156274497 --dir exact-apk
          gh run download 41156274497 --repo "$GITHUB_REPOSITORY" --name sector-rebound-qa-41156274497-1 --dir exact-qa
          test -s exact-apk/app-debug.apk
          test "$(find exact-qa -name '*.png' | wc -l)" -ge 10
          cp exact-apk/app-debug.apk sector-rebound-v0.9.54-lan-ghost-input-debug.apk
          (cd exact-qa && zip -q -r ../sector-rebound-v0.9.54-visual-qa.zip .)
          sha256sum sector-rebound-v0.9.54-lan-ghost-input-debug.apk sector-rebound-v0.9.54-visual-qa.zip > SHA256-v0.9.54.txt
      - name: Publish immutable original APK and QA screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          # Sector Rebound v0.9.54 — LAN Guest Input Timeout (Experimental)

          This is an isolated correctness update for two-phone nearby LAN: while the host is still connected but receives **no guest input** for over 0.4 simulated seconds, it releases stale guest movement, aiming and FIRE instead of allowing continuous ghost movement/shooting. Fresh input resumes control. Also resets on pauses, new matches and reconnect. Existing v0.9.53 on-foot guest aiming, physics, cosmetics, visuals, menus and progress storage remain unchanged.

          **Exact original full-QA-tested source SHA:** `e4cb3e2e9351f1c2a354b35100f23bf0bd9e45a0`.

          - [Full original Chromium layout/screenshots, headless gameplay and Android debug APK + unsigned AAB **SUCCESS**](https://github.com/PlayerEden/Ricochet-Rumble/actions/runs/41156274497). This original debug APK was copied **byte-for-byte**, never rebuilt or resigned.
          - [Focused actual game host watchdog + prior guest input/scored/save/smoke test **SUCCESS**](https://github.com/PlayerEden/Ricochet-Rumble/actions/runs/41156162244).
          - [Source draft PR #83](https://github.com/PlayerEden/Ricochet-Rumble/pull/83), [permanent v0.9.54 test/acceptance report](https://github.com/PlayerEden/Ricochet-Rumble/blob/main/docs/LAN_GUEST_INPUT_FRESHNESS_v0954.md).
          - [Prior v0.9.53 original test APK and source rollback](https://github.com/PlayerEden/Ricochet-Rumble/releases/tag/v0.9.53-lan-pilot-parity-test).
          - The attached ZIP contains actual Chromium QA screenshots and SHA256 text contains exact binary digests.

          **CAUTION — EXPERIMENTAL CI DEBUG, NOT A PRODUCTION OR IN-PLACE UPGRADE.** Its signing certificate may differ from previous debug APKs. **Never uninstall an old copy holding valuable local progress merely to test this build.** Real two-phone LAN connection, latency/jitter, wake/background behavior, durable data-preserving same-signer Android update, and Play approval are all **NOT VERIFIED**. Stable main gameplay is unchanged; draft code is unmerged.
          NOTES
          gh release create v0.9.54-lan-ghost-input-test \
            sector-rebound-v0.9.54-lan-ghost-input-debug.apk \
            sector-rebound-v0.9.54-visual-qa.zip SHA256-v0.9.54.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target e4cb3e2e9351f1c2a354b35100f23bf0bd9e45a0 \
            --prerelease \
            --title "Sector Rebound v0.9.54 — LAN Ghost Input Safety (Experimental)" \
            --notes-file notes.md
