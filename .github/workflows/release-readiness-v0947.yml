name: Sector Rebound - v0.9.47 release readiness audit (no APK)
on:
  push:
    branches: [audit/release-readiness-v0947]
    paths:
      - 'tests/release-readiness-v0947.mjs'
      - 'tests/first-plan-contract-audit.mjs'
      - '.github/workflows/release-readiness-v0947.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify v0.9.47 code-free release readiness audit source
        run: |
          set -euo pipefail
          node --check tests/release-readiness-v0947.mjs
          node --check tests/first-plan-contract-audit.mjs
          node tests/release-readiness-v0947.mjs
          node tests/first-plan-contract-audit.mjs
      - name: Confirm modes, persistence, scoring, no pilot regression and 300 maze seeds
        run: |
          set -euo pipefail
          node tests/smoke.mjs
          node tests/scored-match-kernel.mjs
          node tests/scored-browser-parity.mjs
          node tests/dossier.mjs
          node tests/save-backup.mjs
          node tests/android-upgrade-readiness.mjs
          node tests/test-signer-contract.mjs
          node tools/validate-cosmetic-catalog.mjs
      - name: Preserve inspectable source contracts and manual-blocker register
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0947-release-readiness-source-audit
          path: |
            qa-results/release-readiness-v0947.json
            qa-results/first-plan-contract-audit.json
          retention-days: 90
          if-no-files-found: warn
