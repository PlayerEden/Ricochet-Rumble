name: Sector Rebound - D3-A2 host-alone FFA Survival Co-op
on:
  push:
    branches: [experiment/lan-mode-compatibility-d3-a2]
    paths:
      - 'web/**'
      - 'android/app/src/main/assets/**'
      - 'tests/**'
      - '.github/workflows/lan-modes-d3-a2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lan-modes:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact WebView Android asset parity and syntax
        run: |
          set -euo pipefail
          for asset in game.js index.html lan-room.js lan-series.js scored-match.js style.css; do cmp "web/$asset" "android/app/src/main/assets/$asset"; done
          node --check web/game.js
          node --check tests/lan-modes-d3-a2.mjs
      - name: Pure room, combat, old scoring and save safety
        run: |
          node tests/lan-room-state-d3-a0.mjs
          node tests/lan-series-kernel.mjs
          node tests/smoke.mjs
          node tests/scored-match-kernel.mjs
          node tests/ballistic-trace-a2.mjs
          node tests/save-backup.mjs
      - name: Install Chromium test dependency
        run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Actual solo-host LAN modes and legacy D3-A1/D2 regression
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          node tests/lan-modes-d3-a2.mjs
          node tests/lan-host-bots-d3-a1.mjs
          node tests/lan-lobby-flow-qa.mjs
          node tests/ui-layout-geometry-v0948.mjs
          node tests/visual-qa.mjs
      - name: Archive real-game screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sector-rebound-d3-a2-mode-qa
          path: |
            qa-screens/
            qa-layout/
          retention-days: 14
          if-no-files-found: warn
