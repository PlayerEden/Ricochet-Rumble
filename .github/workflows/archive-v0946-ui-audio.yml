name: Archive exact QA-passing v0.9.46 UI audio preview
on:
  push:
    branches: [integration/ui-audio-v0946-qa]
    paths:
      - '.github/workflows/archive-v0946-ui-audio.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: archive-v0946-ui-audio
  cancel-in-progress: false

jobs:
  archive:
    if: github.repository == 'PlayerEden/Ricochet-Rumble'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require verified QA source and unique tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          RUN=41007675477
          TESTED=01ac4360653f9764c56f335eb91c7bfb1616241a
          TAG=v0.9.46-ui-audio-test
          test "$(gh api "repos/$REPO/actions/runs/$RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$REPO/actions/runs/$RUN" --jq .head_sha)" = "$TESTED"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release tag already exists: refusing overwrite" >&2
            exit 1
          fi
      - name: Archive byte-identical successful APK and screenshot evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 41007675477 --repo "$GITHUB_REPOSITORY" --name debug-apk-41007675477 --dir original-apk
          gh run download 41007675477 --repo "$GITHUB_REPOSITORY" --name sector-rebound-qa-41007675477-1 --dir original-qa
          test -s original-apk/app-debug.apk
          test "$(sha256sum original-apk/app-debug.apk | awk '{print $1}')" = e405e9714399495705e9dec1fbe2f12ea3f9222d91f10ab6aaf6f253b11417f2
          test "$(find original-qa -name '*.png' | wc -l)" -ge 12
          cp original-apk/app-debug.apk sector-rebound-v0.9.46-ui-audio-debug.apk
          (cd original-qa && zip -q -r ../sector-rebound-v0.9.46-ui-audio-qa.zip .)
          sha256sum sector-rebound-v0.9.46-ui-audio-debug.apk sector-rebound-v0.9.46-ui-audio-qa.zip > v0.9.46-sha256.txt
      - name: Publish unchanged debug APK and inspectable QA evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          # Sector Rebound v0.9.46 — UI + Audio Feedback (Experimental)
          Adds quiet synthesized menu-select/back/deploy cues to the existing offline SFX engine, plus in-match Solo/Host/Guest pause SFX/MUSIC ON/OFF controls. Toggles persist through original settings and keep tactical menus compact. No changes to locked P-03 pilot art/movement, aim, vehicles, physics, scoring, procedural maps, LAN protocol or local saves.

          **Original automated QA PASS:**
          - Tested QA-only integration snapshot SHA: `01ac4360653f9764c56f335eb91c7bfb1616241a`. This QA snapshot includes **the same game sources, Android assets, tests and version metadata as focused draft PR #67**, plus the main-branch owner-approved pilot design document. It has NOT been merged into stable main.
          - Fast Node regression + 300 maze seeds / pause-audio preference tests: https://github.com/PlayerEden/Ricochet-Rumble/actions/runs/41007675662
          - Full actual Chromium at 740×360, 915×412, 1280×720 + Android debug APK + unsigned AAB: https://github.com/PlayerEden/Ricochet-Rumble/actions/runs/41007675477
          - Original debug APK copied byte-for-byte from successful QA, NOT rebuilt or resigned. QA screenshot ZIP and SHA256 included.
          - Focused development PR: https://github.com/PlayerEden/Ricochet-Rumble/pull/67 ; QA-only integration PR: https://github.com/PlayerEden/Ricochet-Rumble/pull/68
          - Actual user Android UI/audio comfort verdict pending; prior owner-approved P-03 release remains the rollback baseline.

          **CLEAN INSTALL TEST ONLY:** CI debug signers vary between builds and are NOT safe for an in-place install over an older differently signed copy. Do not uninstall an app with valuable progress. This is not Play release-signed and does not confirm two-phone LAN or Android app upgrade continuity. Stable main unchanged.
          NOTES
          gh release create v0.9.46-ui-audio-test \
            sector-rebound-v0.9.46-ui-audio-debug.apk \
            sector-rebound-v0.9.46-ui-audio-qa.zip \
            v0.9.46-sha256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target 01ac4360653f9764c56f335eb91c7bfb1616241a \
            --prerelease \
            --title "Sector Rebound v0.9.46 — UI and Audio Test (Clean Install)" \
            --notes-file release-notes.md
