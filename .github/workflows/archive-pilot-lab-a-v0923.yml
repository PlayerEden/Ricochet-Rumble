name: Archive Pilot Lab A exact QA APK and gameplay screenshots (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-pilot-lab-a-v0923.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: pilot-lab-a-archival-release
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve exact successful prototype QA artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run view 40605849092 --repo "$REPO" --json conclusion,headSha --jq '"QA: " + .conclusion + " " + .headSha' | tee provenance.txt
          grep -Fxq 'QA: success d593fd50dc72a71d24330b77a3c5c2c867248e94' provenance.txt
          gh run download 40605849092 --repo "$REPO" --name pilot-prototype-debug-apk-40605849092 --dir original-apk
          gh run download 40605849092 --repo "$REPO" --name pilot-silhouette-qa-40605849092 --dir original-qa
          APK="$(find original-apk -type f -name 'app-debug.apk' | head -n 1)"
          test -s "$APK"
          cp "$APK" sector-rebound-v0.9.23-pilot-lab-a-debug.apk
          for TYPE in before after; do
            SOURCE="$(find original-qa -type f -path "*/$TYPE/915x412-on-foot-idle.png" | head -n 1)"
            test -s "$SOURCE"
            cp "$SOURCE" pilot-lab-a-$TYPE-915x412.png
          done
          (cd original-qa && zip -q -r ../pilot-lab-a-full-screenshots-and-sim.zip .)
          sha256sum sector-rebound-v0.9.23-pilot-lab-a-debug.apk pilot-lab-a-before-915x412.png pilot-lab-a-after-915x412.png pilot-lab-a-full-screenshots-and-sim.zip > pilot-lab-a-qa-sha256.txt
      - name: Create unique, immutable experimental prerelease (never overwrite dev5)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=v0.9.23-pilot-lab-a-test
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo 'Existing pilot lab release found; refusing overwrite'
            exit 1
          fi
          cat > notes.md <<'EOF'
          # Sector Rebound -- experimental PILOT LAB A
          
          **Not an accepted mainline game release, paid cosmetic, or a production Play APK.** This is an isolated, reversible game-art experiment from [prototype/pilot-human-silhouette-v0923](https://github.com/PlayerEden/Ricochet-Rumble/tree/prototype/pilot-human-silhouette-v0923), based on currently unmerged [Quick Play PR #24](https://github.com/PlayerEden/Ricochet-Rumble/pull/24). **No branch was merged.**

          **Exact QA-proven source**: `d593fd50dc72a71d24330b77a3c5c2c867248e94`, [successful full browser/gameplay/Android run 40605849092](https://github.com/PlayerEden/Ricochet-Rumble/actions/runs/40605849092). The APK is downloaded from that successful action and uploaded unchanged, not rebuilt or resigned. SHA-256 manifest provided.

          ## In-game visual change
          - Original top-down human silhouette: two counterstepping boots, narrower vest/shoulders, faceted helmet/visor, bent arms and off-center handgun.
          - Clearer indicators: on-foot player arrow and ID moved off the character; lower-opacity on-foot selection and shield outlines. Tank/mech visuals and shield durations/damage remain unchanged.
          - **Locked camera** remains pilot 1.07, tank 0.82, mech 0.77. Physics, input, hitboxes, damage, mode playlists, procedural maps and After Action remain same as the dev5 foundation.
          - Original screenshot archive has live before/after shots at 740×360, 915×412 and 1280×720. Two original screenshot PNGs at 915×412 included separately for quick comparison. These images are rendered from the actual game, not AI illustrations.
          - See [lab design/QA notes](https://github.com/PlayerEden/Ricochet-Rumble/blob/prototype/pilot-human-silhouette-v0923/docs/PILOT_SILHOUETTE_LAB_A_v0923.md) and [pilot issue #26](https://github.com/PlayerEden/Ricochet-Rumble/issues/26).

          ## Phone playtest
          Test on-foot idle/walk/aim/fire, ejection and entering tanks. Does the pilot now look human rather than a miniature tank? Can you distinguish helmet, arms and boots at real viewing size? Do the P1 label/shield/white pointer obstruct anything? Report any texture jitter, clipping or fps drops. This is **Candidate A** -- user visual approval remains pending, not automatic from green CI.

          ## Install warning
          **DEBUG-signed**, not Play signed. Android may reject upgrading the existing Sector Rebound package if debug signing certificate differs; uninstalling the old app **deletes local app data/settings**. Back up before removing an older install; compare screenshots first if you prefer. Internal Android versionName still `0.9.21-game-feel` even though code is experimental v0.9.23. Preserve [dev5 known-good build](https://github.com/PlayerEden/Ricochet-Rumble/releases/tag/v0.9.22-dev5-final-camera-test); no PR #24 merge or LAN acceptance has occurred.
          EOF
          gh release create "$TAG" sector-rebound-v0.9.23-pilot-lab-a-debug.apk pilot-lab-a-before-915x412.png pilot-lab-a-after-915x412.png pilot-lab-a-full-screenshots-and-sim.zip pilot-lab-a-qa-sha256.txt --repo "$REPO" --target d593fd50dc72a71d24330b77a3c5c2c867248e94 --title 'Sector Rebound v0.9.23 Pilot Lab A — experimental Android art review' --notes-file notes.md --prerelease
