name: Sector Rebound - B2 allied aiming + LAN privacy contract
on:
  push:
    branches: [experiment/allied-aim-traces-b2]
    paths:
      - 'web/**'
      - 'android/app/src/main/assets/**'
      - 'tests/smoke.mjs'
      - 'tests/allied-aim-visual-qa.mjs'
      - '.github/workflows/allied-aim-b2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  allied-aim:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mirror source and validate JavaScript
        run: |
          cmp web/game.js android/app/src/main/assets/game.js
          cmp web/index.html android/app/src/main/assets/index.html
          node --check web/game.js
          node --check tests/smoke.mjs
      - name: Real-engine teammate intent + LAN snapshot privacy + ballistics
        run: |
          node tests/smoke.mjs
          node tests/ballistic-trace-a2.mjs
          node tests/save-backup.mjs
      - name: Chromium two-viewport allied aiming visibility audit
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          npm install --no-save --ignore-scripts playwright-core@1.56.1
          node tests/allied-aim-visual-qa.mjs
      - name: Upload real visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allied-aim-b2-visual-evidence
          path: |
            qa-screens/allied-aim-*.png
            qa-results/allied-aim-b2.json
          if-no-files-found: ignore
          retention-days: 3
