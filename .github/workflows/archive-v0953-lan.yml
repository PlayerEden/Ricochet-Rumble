name: Archive exact QA-tested v0.9.53 LAN pilot input APK
on:
  push:
    branches: [feature/lan-pilot-input-parity-v0953]
    paths:
      - '.github/workflows/archive-v0953-lan.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: v0953-lan-original-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require fully green exact tested run and unused release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN=41149116261
          SHA=746816a14e27d18edfed3daecdace5cf520d633f
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .head_sha)" = "$SHA"
          if gh release view v0.9.53-lan-pilot-parity-test --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to replace existing test release' >&2
            exit 1
          fi
      - name: Copy byte-identical debug APK and real browser QA screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 41149116261 --repo "$GITHUB_REPOSITORY" --name debug-apk-41149116261 --dir exact-apk
          gh run download 41149116261 --repo "$GITHUB_REPOSITORY" --name sector-rebound-qa-41149116261-1 --dir exact-qa
          test -s exact-apk/app-debug.apk
          test "$(find exact-qa -name '*.png' | wc -l)" -ge 10
          cp exact-apk/app-debug.apk sector-rebound-v0.9.53-lan-pilot-parity-debug.apk
          (cd exact-qa && zip -q -r ../sector-rebound-v0.9.53-visual-qa.zip .)
          sha256sum sector-rebound-v0.9.53-lan-pilot-parity-debug.apk sector-rebound-v0.9.53-visual-qa.zip > SHA256-v0.9.53.txt
      - name: Publish original QA APK, evidence ZIP, source SHA and clean-install warning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release.md <<'NOTES'
          # Sector Rebound v0.9.53 — LAN Pilot Input Parity Experimental

          Adds missing local LAN guest **on-foot FIRE-drag independent aim** in the existing input packet, host-validated finite aim axes, and matching 6.5 rad/s pilot rotation for both human LAN seats. Other vehicles, ricochet physics, pilot artwork, GUI/audio, map generation and data saves remain unchanged.

          **Exact original built and QA-tested source commit:** `746816a14e27d18edfed3daecdace5cf520d633f`.

          - [Full original real Chromium screenshots + actual Android debug APK and unsigned AAB **PASS**](https://github.com/PlayerEden/Ricochet-Rumble/actions/runs/41149116261). APK copied **byte-for-byte** from this original successful run, never rebuilt or re-signed for release.
          - [Focused actual game-engine host/guest aim and input sanitization + scoring/save/smoke **PASS**](https://github.com/PlayerEden/Ricochet-Rumble/actions/runs/41148986844).
          - [Permanent v0.9.53 code review, test details and remaining 2-device gates](https://github.com/PlayerEden/Ricochet-Rumble/blob/main/docs/LAN_PILOT_INPUT_PARITY_v0953.md).
          - [Draft source PR #82](https://github.com/PlayerEden/Ricochet-Rumble/pull/82) — **NOT MERGED**. Original [v0.9.51 known-good prerelease rollback](https://github.com/PlayerEden/Ricochet-Rumble/releases/tag/v0.9.51-corridor-recovery-prototype) preserved.

          **WARNING: TEST DEBUG APK, CLEAN INSTALL ONLY ON A NONESSENTIAL TEST INSTALLATION.** Older CI debug builds may be signed with different certificates; an in-place update is NOT guaranteed. **Do not uninstall an old app with important saved progress just to test this APK.** Real two-phone Wi-Fi matchmaking/jitter/reconnect and safe same-certificate Android update are STILL UNVERIFIED. This APK is not a Google Play signed release.
          NOTES
          gh release create v0.9.53-lan-pilot-parity-test \
            sector-rebound-v0.9.53-lan-pilot-parity-debug.apk \
            sector-rebound-v0.9.53-visual-qa.zip \
            SHA256-v0.9.53.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target 746816a14e27d18edfed3daecdace5cf520d633f \
            --prerelease \
            --title "Sector Rebound v0.9.53 — LAN Pilot Aim/FIRE Parity Experimental" \
            --notes-file release.md
