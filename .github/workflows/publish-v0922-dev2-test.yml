name: Publish exact v0.9.22-dev2 QA APK (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0922-dev2-test.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-v0922-dev2-test
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the EXACT debug APK that passed full QA (no rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run view 40594730629 --repo "$REPO" --json conclusion,headSha --jq '"QA: " + .conclusion + " " + .headSha' | tee qa-provenance.txt
          grep -Fxq 'QA: success e1f13f99a023792773ef25482572f6c5ed938363' qa-provenance.txt
          gh run download 40594730629 --repo "$REPO" --name debug-apk-40594730629 --dir apk-source
          APK=$(find apk-source -type f -name 'app-debug.apk' | head -n 1)
          test -n "$APK" && test -s "$APK"
          cp "$APK" sector-rebound-v0.9.22-dev2-qa-debug.apk
          sha256sum sector-rebound-v0.9.22-dev2-qa-debug.apk > sector-rebound-v0.9.22-dev2-qa-debug.sha256
      - name: Publish immutable one-time TEST prerelease (never replace previous APK)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=v0.9.22-dev2-test
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Tag already exists; refusing to overwrite or attach assets."
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          ## Sector Rebound v0.9.22-dev2 -- DEBUG PLAYTEST BUILD (NOT GOOGLE PLAY READY)

          This is the **identical debug APK** from the successful [QA run 40594730629](https://github.com/PlayerEden/Ricochet-Rumble/actions/runs/40594730629), **not a recompiled or independently signed build**.
          
          Verified game source: `e1f13f99a023792773ef25482572f6c5ed938363` (draft PR #24). Automated gameplay regressions, Chromium 740x360/915x412/1280x720 screenshots, Android compilation and source parity PASSED.

          **What to test:** Quick Play settings (enable 0/1/2 modes), SOLO SURVIVAL vs TEAM SURVIVAL rotation, unique procedural layouts on NEXT MATCH, and After Action victory/defeat, operator KOs, pilot deaths, active match duration, and lives remaining. Test multiple rounds and portrait/landscape/background handling. LAN play is experimental and needs two devices.

          **APK caution:** Debug-signed (not an official Play app). This exact QA binary retains Gradle's internal `versionName '0.9.21-game-feel'` and package `com.playereden.ricochetrumble`, despite including v0.9.22-dev2 gameplay; this is an internal development version mismatch, not an old gameplay build. It may not update an installed APK if debug keys differ. If Android says the package conflicts, backup your settings/data before uninstalling older builds -- uninstalling deletes local app data. Do not install the unsigned AAB.

          **Still pending:** actual physical phone/LAN acceptance, production signing and new competitive game modes. Report reproducible issues in draft PR #24 or ChatGPT. Check SHA-256 text file against your APK if desired.

          Android build artifacts from GitHub Actions normally expire after 14 days; this release preserves the test APK and its checksum.
          EOF
          gh release create "$TAG" sector-rebound-v0.9.22-dev2-qa-debug.apk sector-rebound-v0.9.22-dev2-qa-debug.sha256 --repo "$REPO" --target e1f13f99a023792773ef25482572f6c5ed938363 --title 'Sector Rebound v0.9.22-dev2 - Android QA playtest' --notes-file release-notes.md --prerelease
