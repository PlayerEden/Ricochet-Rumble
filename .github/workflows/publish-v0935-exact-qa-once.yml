name: Sector Rebound - archive exact v0.9.35 Custom Match Android test once
on:
  push:
    branches:
      - feature/custom-match-v0935
    paths:
      - .github/workflows/publish-v0935-exact-qa-once.yml
permissions:
  contents: write
  actions: read
jobs:
  archive-original-passing-artifact:
    if: github.repository == 'PlayerEden/Ricochet-Rumble'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      QA_RUN: '40830083479'
      SOURCE_SHA: '8d7f8c7b42804f87a9203d5b8cc4055c408560c3'
      TAG: 'v0.9.35-custom-match-test'
      APK: 'sector-rebound-v0.9.35-custom-match-debug.apk'
    steps:
      - name: Refuse failed QA or incorrect source or preexisting release
        run: |
          set -euo pipefail
          details="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA_RUN")"
          test "$(jq -r '.status' <<< "$details")" = "completed"
          test "$(jq -r '.conclusion' <<< "$details")" = "success"
          test "$(jq -r '.head_sha' <<< "$details")" = "$SOURCE_SHA"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Immutable tag already exists; no overwriting permitted" >&2
            exit 1
          fi
      - name: Retrieve original QA-passing APK and screenshot evidence
        run: |
          set -euo pipefail
          mkdir -p original qa
          gh run download "$QA_RUN" --repo "$GITHUB_REPOSITORY" --name "debug-apk-$QA_RUN" --dir original
          gh run download "$QA_RUN" --repo "$GITHUB_REPOSITORY" --name "sector-rebound-qa-$QA_RUN-1" --dir qa
          test -s original/app-debug.apk
          mv original/app-debug.apk "$APK"
          zip -qr "sector-rebound-v0.9.35-custom-match-qa.zip" qa
          sha256sum "$APK" "sector-rebound-v0.9.35-custom-match-qa.zip" > "v0.9.35-sha256.txt"
      - name: Archive exact tested APK as immutable experimental prerelease
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Preexisting tag: refusing to overwrite" >&2
            exit 1
          fi
          {
            echo '# Sector Rebound v0.9.35 — Custom Match Android Test'
            echo
            echo '**Experimental debug APK: automated QA passed, physical phone approval PENDING; not Google Play signed.**'
            echo
            echo '- New standalone Custom Match screen with offline Survival FFA and Team Survival rules: maze sizes, bots, AI skill, lives and shell capacity.'
            echo '- Scored CQC/vehicle FFA/TDM remain fixed experimental presets; only AI skill adjustable.'
            echo '- Separate saved custom rule draft. Accurate live preview, Same Rules/New Sector and Edit Rules After Action.'
            echo '- Corrected small-landscape home-screen HELP touch-target overlap.'
            echo '- Existing Quick Play playlist, combat, scoring, AI and LAN protocols preserved.'
            echo '- Original QA APK copied byte-identically without rebuilding or resigning.'
            echo "- Tested game/test source SHA: $SOURCE_SHA"
            echo "- Fast regression: https://github.com/$GITHUB_REPOSITORY/actions/runs/40830083491"
            echo "- Full Chromium + Android QA: https://github.com/$GITHUB_REPOSITORY/actions/runs/$QA_RUN"
            echo "- Draft PR #54: https://github.com/$GITHUB_REPOSITORY/pull/54"
            echo "- APK SHA-256: $(sha256sum "$APK" | awk '{print $1}')"
            echo
            echo 'Still required: Reset to Defaults, named saved presets, owner physical phone acceptance, natural match fairness telemetry, signed Play bundle, two-phone LAN testing.'
            echo 'A differing debug certificate can block in-place update. Uninstalling may erase preferences.'
          } > release-notes.md
          gh release create "$TAG" "$APK" "sector-rebound-v0.9.35-custom-match-qa.zip" "v0.9.35-sha256.txt" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --prerelease --title "Sector Rebound v0.9.35 — Custom Match Android Test" --notes-file release-notes.md
