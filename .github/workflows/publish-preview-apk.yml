name: Publish Sector Rebound Android Preview
on:
  push:
    branches: [dev/sector-rebound-pilot-silhouette-v0919]
    paths:
      - '.github/workflows/publish-preview-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify game regression and pilot art manifest
        run: |
          node tests/smoke.mjs
          node tools/validate-cosmetic-catalog.mjs
      - name: Build test APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish permanent GitHub pre-release APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.9.19-pilot-preview
          APK: android/app/build/outputs/apk/debug/app-debug.apk
          ASSET: Sector-Rebound-v0.9.19-Pilot-Preview.apk
        run: |
          set -euo pipefail
          test -s "$APK"
          sha256sum "$APK"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK#$ASSET" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title 'Sector Rebound v0.9.19 — Pilot Visual Preview (Android)' \
              --notes 'Installable Android debug test APK for the pilot silhouette and FIELDGRID concept-art pass. This is a pre-release, not a signed Google Play production build. Gameplay balance and LAN protocol are unchanged. Portrait icons are only design-review source files, not selectable cosmetics. Existing installations signed with a different debug key may need to be uninstalled before this APK installs; back up any local data first.'
          fi
