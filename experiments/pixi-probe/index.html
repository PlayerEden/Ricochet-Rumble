<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101f2b">
<title>Sector Rebound — FIELDGRID Renderer Test</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <div class="field" id="field" aria-label="Combat rendering comparison">
    <canvas id="canvas2d" width="960" height="540" aria-label="Canvas renderer"></canvas>
    <div id="pixi-host"></div>
    <div class="match-hud">
      <div class="score">CYAN <strong id="kills">0</strong> <span class="slash">/</span> CORAL <strong id="deaths">0</strong></div>
      <span id="backend" class="backend">INITIALIZING</span>
    </div>
    <div class="controls">
      <div class="stick-shell" id="stick" role="group" aria-label="Move tank"><div class="knob" id="knob"></div></div>
      <button type="button" class="fire" id="fire" aria-label="Drag to aim then release to fire">FIRE</button>
    </div>
  </div>
  <footer>
    <div class="modes" role="group" aria-label="Renderer choice">
      <button id="use-pixi" type="button" class="selected">PIXI / WEBGL</button>
      <button id="use-canvas" type="button">CANVAS 2D</button>
      <button id="reset" type="button">RESET</button>
      <button id="use-match" type="button" class="selected">MATCH LOAD</button>
      <button id="use-stress" type="button">STRESS LOAD</button>
    </div>
    <div class="measure"><span id="fps">FPS —</span><span id="render-ms">CPU submit —</span><span id="shots">SHOTS —</span></div>
  </footer>
  <div id="notice" role="status" aria-live="polite">Production FIELDGRID visuals • tank, mech, P-03 pilot • identical cached art in both renderers.</div>
</main>
<script defer src="bundle.js"></script>
</body>
</html>
